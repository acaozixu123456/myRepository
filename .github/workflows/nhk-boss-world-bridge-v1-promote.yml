name: Promote NHK Boss world bridge v1

on:
  push:
    branches: [nihongo-boss-world-bridge-v1-20260901]
    paths:
      - '.github/workflows/nhk-boss-world-bridge-v1-promote.yml'

permissions:
  contents: write

jobs:
  verify-promote-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-boss-world-bridge-v1-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Wait until weekly Boss is verified in production
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = 'https://raw.githubusercontent.com/acaozixu123456/myRepository/nihongo-vercel/docs/verification/NHK_WEEKLY_BOSS_V1.json'
          last = None
          for attempt in range(1, 61):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'NihongoBossBridgeWait/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  assert payload.get('result') == 'PASS'
                  break
              except Exception as error:
                  last = repr(error)
                  time.sleep(10)
          else:
              raise RuntimeError(last or 'weekly Boss evidence unavailable')
          PY
      - name: Rebase and apply causal bridge
        run: |
          git fetch origin nihongo-vercel nihongo-boss-world-bridge-v1-20260901
          git rebase origin/nihongo-vercel
          python scripts/patch-nhk-boss-world-bridge-v1.py
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Finish if already verified
        run: |
          if [ -f /tmp/boss_world_bridge_already_verified ]; then
            rm -f scripts/patch-nhk-boss-world-bridge-v1.py .github/workflows/nhk-boss-world-bridge-v1-promote.yml
            git config user.name "Sol Supervisor"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Clean duplicate Boss world bridge verifier" || true
            git push --force-with-lease origin HEAD:nihongo-boss-world-bridge-v1-20260901
            echo already_verified=true >> "$GITHUB_ENV"
          else
            echo already_verified=false >> "$GITHUB_ENV"
          fi
      - name: Commit clean implementation and promote
        if: env.already_verified == 'false'
        run: |
          rm -f scripts/patch-nhk-boss-world-bridge-v1.py .github/workflows/nhk-boss-world-bridge-v1-promote.yml
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Carry weekly Boss results into next-week world"
          git push --force-with-lease origin HEAD:nihongo-boss-world-bridge-v1-20260901
          git fetch origin nihongo-vercel
          git merge-base --is-ancestor origin/nihongo-vercel HEAD
          git push origin HEAD:nihongo-vercel
          git rev-parse HEAD > /tmp/implementation_commit
      - name: Wait for Vercel deployment
        if: env.already_verified == 'false'
        run: sleep 50
      - name: Verify production bundle and parser
        if: env.already_verified == 'false'
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
          ARTICLE: https://www.mojidict.com/article/lzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          base = os.environ['BASE'].rstrip('/')
          article = os.environ['ARTICLE']
          def get(url, attempts=10):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'NihongoBossWorldBridge/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=50) as response:
                          return response.read().decode('utf-8')
                  except Exception as error:
                      last = error
                      time.sleep(min(attempt * 3, 15))
              raise last
          html = get(base + '/')
          match = re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
          assert match
          javascript = get(urllib.parse.urljoin(base + '/', match.group(1)))
          markers = ['nihongo-nhk-boss-world-bridge-v1', '-next-week-world', '上周 Boss 的后续', '改变本周剧情']
          missing = [marker for marker in markers if marker not in javascript]
          assert not missing, f'missing Boss-world markers: {missing}'
          parsed = json.loads(get(base + '/api/moji-article?' + urllib.parse.urlencode({'url': article})))
          assert parsed.get('ok') is True and len(parsed.get('sentences') or []) >= 3
          with open('/tmp/boss_world_smoke.json', 'w', encoding='utf-8') as handle:
              json.dump({'sentenceCount': len(parsed['sentences']), 'resolvedBy': parsed.get('resolvedBy'), 'markers': markers}, handle, ensure_ascii=False, indent=2)
          PY
      - name: Record authoritative production evidence
        if: env.already_verified == 'false'
        run: |
          mkdir -p docs/verification
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              'schemaVersion': 1,
              'result': 'PASS',
              'feature': 'NHK_BOSS_WORLD_BRIDGE_V1',
              'implementationCommit': Path('/tmp/implementation_commit').read_text().strip(),
              'verifiedAt': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'trigger': 'first eligible week after a completed weekly Boss',
              'source': 'persisted weekly Boss results and missed target expression',
              'flow': ['show prior Boss hook', 'ask a real-action follow-up', 'record and analyze answer', 'persist character reaction', 'consume callback once'],
              'choiceQuestions': 0,
              'audioPersistence': False,
              'localPersistence': 'nihongo-nhk-boss-world-bridge-v1',
              'productionSmoke': json.loads(Path('/tmp/boss_world_smoke.json').read_text()),
          }
          Path('docs/verification/NHK_BOSS_WORLD_BRIDGE_V1.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/verification/NHK_BOSS_WORLD_BRIDGE_V1.json
          git commit -m "Verify weekly Boss world bridge in production"
          git push origin HEAD:nihongo-boss-world-bridge-v1-20260901
          git push origin HEAD:nihongo-vercel
