name: Verify NHK DailyInputV2 polish

on:
  push:
    branches: [nihongo-daily-input-v2-20260901]
    paths:
      - '.github/workflows/nhk-daily-input-v2-polish.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-daily-input-v2-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply final polish
        run: python scripts/patch-nhk-daily-input-v2-polish.py
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified polish and remove one-time files
        run: |
          rm scripts/patch-nhk-daily-input-v2-polish.py
          rm .github/workflows/nhk-daily-input-v2-polish.yml
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add src/NhkMorningPage.tsx src/nhkMorning.ts src/nhkMorning.test.ts scripts/patch-nhk-daily-input-v2-polish.py .github/workflows/nhk-daily-input-v2-polish.yml
          git commit -m "Polish NHK DailyInputV2 recall semantics"
          git push origin HEAD:nihongo-daily-input-v2-20260901
