name: Public phone UI, real silent notes and sourced news
on:
  push:
    branches: [nihongo-adaptive-companion-v3-20260909]
    paths: ['scripts/companion-public-written.mjs','.github/workflows/companion-public-written.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - run: node --check scripts/companion-public-written.mjs && node scripts/companion-public-written.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-public-written
          path: artifacts/companion-public-written/
