name: Verify quiet learning and readable UI v2

on:
  push:
    branches: [nihongo-quiet-readable-ui-v1-20260902]
    paths:
      - '.github/workflows/verify-quiet-readable-ui-v2.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-quiet-readable-ui-v1-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reassemble and verify bounded source bundle
        shell: bash
        run: |
          set -euxo pipefail
          cat scripts/quiet-readable-ui-bundle.part-* | base64 -d > /tmp/quiet-readable-ui-bundle.tgz
          echo 'd5c40cb17c792699311c9558c337ac008e7a46a7966f8fe4f0d651aabd662d40  /tmp/quiet-readable-ui-bundle.tgz' | sha256sum -c -
          tar -tzf /tmp/quiet-readable-ui-bundle.tgz >/dev/null
          tar -xzf /tmp/quiet-readable-ui-bundle.tgz
      - name: Verify product contracts
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "export type NhkPracticeMode = 'voice' | 'quiet'" src/nhkPracticeMode.ts
          grep -q "静音学习" src/NhkPracticeModeSwitch.tsx
          grep -q "responseMode" src/nhkMorning.ts
          grep -q "quietReviews" src/nhkMorning.ts
          grep -q "voiceCompleted" src/nhkEvidence.ts
          grep -Eq "font-size:[[:space:]]*15px" src/nhkReadable.css
          grep -Eq "\.nhk-page[[:space:]]+small" src/nhkReadable.css
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified bounded source changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/NhkBossPage.tsx \
            src/NhkEvidencePage.tsx \
            src/NhkMorningPage.tsx \
            src/NhkPracticeModeSwitch.tsx \
            src/NhkQuietResponseCard.tsx \
            src/NhkQuietReview.tsx \
            src/NhkWorldEvent.tsx \
            src/nhkEvidence.ts \
            src/nhkEvidence.test.ts \
            src/nhkMorning.ts \
            src/nhkMorning.test.ts \
            src/nhkPracticeMode.ts \
            src/nhkPracticeMode.test.ts \
            src/nhkReadable.css \
            src/nhkReadable.test.ts
          git diff --cached --check
          git commit -m "Add quiet learning mode and readable UI"
          git push origin HEAD:nihongo-quiet-readable-ui-v1-20260902
