name: NHK coach self-cleaning final smoke

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/nhk-coach-contract-smoke-self-clean.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-vercel
          fetch-depth: 0
      - name: Wait for production promotion
        run: sleep 40
      - name: Verify sharing, stable parsing and grounded coach recommendations
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
          ARTICLE: https://www.mojidict.com/article/lzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          base = os.environ['BASE']
          article = os.environ['ARTICLE']

          def get_bytes(url, attempts=6):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent':'NihongoCoachFinal/2.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return response.status, response.read()
                  except Exception as error:
                      last = repr(error)
                      time.sleep(4 * attempt)
              raise RuntimeError(last)

          def post_json(url, payload, attempts=5):
              last = None
              body = json.dumps(payload, ensure_ascii=False).encode('utf-8')
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      url,
                      data=body,
                      method='POST',
                      headers={'User-Agent':'NihongoCoachFinal/2.0','Content-Type':'application/json'},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=70) as response:
                          return response.status, json.loads(response.read().decode('utf-8'))
                  except urllib.error.HTTPError as error:
                      last = {'status': error.code, 'body': error.read().decode('utf-8', errors='replace')}
                  except Exception as error:
                      last = repr(error)
                  time.sleep(5 * attempt)
              raise RuntimeError(last)

          status, body = get_bytes(base + '/manifest.webmanifest')
          assert status == 200
          manifest = json.loads(body.decode('utf-8'))
          assert manifest['share_target']['action'] == '/?share_target=1'
          assert manifest['share_target']['params']['url'] == 'url'

          share_url = base + '/?' + urllib.parse.urlencode({'share_target':'1','url':article})
          status, body = get_bytes(share_url)
          html = body.decode('utf-8', errors='replace')
          assert status == 200 and 'id="root"' in html and 'manifest.webmanifest' in html

          parse_url = base + '/api/moji-article?' + urllib.parse.urlencode({'url': article})
          status, body = get_bytes(parse_url)
          parsed = json.loads(body.decode('utf-8'))
          assert status == 200 and parsed.get('ok') is True
          assert parsed.get('resolvedBy') == 'public-nhk-archive'
          sentences = parsed.get('sentences') or []
          assert len(sentences) >= 5
          assert '子どものSNSの使い方が' in sentences[0]
          assert all('石田彰' not in sentence and 'セロ弾き' not in sentence for sentence in sentences)

          status, payload = post_json(base + '/api/nhk-coach', {
              'title': parsed['title'],
              'sentences': sentences,
          })
          assert status == 200 and payload.get('ok') is True
          coach = payload.get('coach') or {}
          recommendations = coach.get('recommendations') or []
          labels = [item.get('label') for item in recommendations]
          picked = [item.get('sentence') for item in recommendations]
          assert labels == ['核心', '跟读', '迁移'], labels
          assert len(recommendations) == 3
          assert len(set(picked)) == 3, picked
          assert all(sentence in sentences for sentence in picked)
          assert all(item.get('chunks') for item in recommendations)
          assert all(item.get('expression') and item.get('dailyVersion') and item.get('workVersion') for item in recommendations)

          print(json.dumps({
              'ok': True,
              'model': payload.get('model'),
              'cached': payload.get('cached'),
              'labels': labels,
              'sentences': picked,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Remove one-time smoke workflows after PASS
        run: |
          git config user.name acaozixu123456
          git config user.email 331004814@qq.com
          git rm -f \
            .github/workflows/nhk-coach-contract-smoke-once.yml \
            .github/workflows/nhk-coach-contract-smoke-final.yml \
            .github/workflows/nhk-coach-contract-smoke-self-clean.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove completed NHK coach smoke workflows"
          git push origin HEAD:nihongo-vercel
