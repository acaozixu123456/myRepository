name: Quiet teacher and previous backlog final verification
on:
  push:
    branches: [nihongo-adaptive-companion-v3-20260909]
    paths: ['scripts/finish-quiet-teacher.py']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python scripts/finish-quiet-teacher.py
          git config user.name 'Sol supervisor'
          git config user.email '331004814@qq.com'
          git add supabase/functions/nihongo-companion/content.ts scripts/companion-written-live.mjs
          git commit -m 'Review news claims against actual evidence with stronger text model'
          git push origin HEAD:nihongo-adaptive-companion-v3-20260909
          mkdir -p artifacts/companion-final
          git rev-parse HEAD > artifacts/companion-final/source-sha.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/quiet-ready.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          node scripts/companion-phone.mjs
          node scripts/companion-written-live.mjs
      - name: Verify exact public preview and export reviewed source
        if: always()
        run: |
          node scripts/companion-preview-access.mjs
          git archive HEAD src api server supabase scripts package.json package-lock.json tsconfig.json vite.config.ts index.html companion.html explore.html README.md > artifacts/companion-final/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-quiet-final
          path: |
            artifacts/companion-final/
            artifacts/companion-phone/
            artifacts/companion-written/
            artifacts/companion-live/
            artifacts/companion-access/
