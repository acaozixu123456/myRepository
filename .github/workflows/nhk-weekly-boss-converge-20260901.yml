name: Converge weekly NHK Boss v1

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/nhk-weekly-boss-converge-20260901.yml'

permissions:
  contents: write

jobs:
  converge-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-vercel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Wait for concurrent production promotions and refresh HEAD
        run: |
          sleep 90
          git fetch origin nihongo-vercel nihongo-weekly-boss-v1-20260901
          git reset --hard origin/nihongo-vercel
      - name: Converge weekly Boss implementation
        run: |
          verified=false
          if [ -f docs/verification/NHK_WEEKLY_BOSS_V1.json ]; then
            verified=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print('true' if json.loads(Path('docs/verification/NHK_WEEKLY_BOSS_V1.json').read_text()).get('result') == 'PASS' else 'false')
          except Exception:
              print('false')
          PY
          )
          fi
          if [ "$verified" != "true" ]; then
            recover_patch() {
              if git show origin/nihongo-weekly-boss-v1-20260901:scripts/patch-nhk-weekly-boss-v1.py > /tmp/patch-weekly-boss.py 2>/dev/null; then
                return 0
              fi
              deleted=$(git log origin/nihongo-weekly-boss-v1-20260901 --diff-filter=D -1 --format=%H -- scripts/patch-nhk-weekly-boss-v1.py)
              if [ -n "$deleted" ]; then
                git show "${deleted}^:scripts/patch-nhk-weekly-boss-v1.py" > /tmp/patch-weekly-boss.py
                return 0
              fi
              return 1
            }
            if [ ! -f src/nhkWeeklyBoss.ts ] || [ ! -f src/NhkWeeklyBoss.tsx ] || ! grep -q "NhkWeeklyBoss" src/NhkMorningPage.tsx; then
              recover_patch
              python /tmp/patch-weekly-boss.py
            fi
            python - <<'PY'
          from pathlib import Path
          module = Path('src/nhkWeeklyBoss.ts')
          if module.exists():
              text = module.read_text(encoding='utf-8')
              text = text.replace(
                  "return fromInput.map(({primary: _primary, ...item}) => item);",
                  "return fromInput.map(item => ({\n"
                  "    sessionId: item.sessionId,\n"
                  "    dateKey: item.dateKey,\n"
                  "    title: item.title,\n"
                  "    summaryZh: item.summaryZh,\n"
                  "    sourceSentence: item.sourceSentence,\n"
                  "    expression: item.expression,\n"
                  "    dailyVersion: item.dailyVersion,\n"
                  "    workVersion: item.workVersion,\n"
                  "  }));",
              )
              module.write_text(text, encoding='utf-8')
          test = Path('src/nhkWeeklyBoss.test.ts')
          if test.exists():
              text = test.read_text(encoding='utf-8')
              text = text.replace(
                  "const review = (roundId: string, used: boolean): NhkSpeechReview => ({",
                  "const review = (roundId: string, used: boolean) => ({",
              ).replace(
                  "  feedbackModel: 'test',\n});",
                  "  feedbackModel: 'test',\n} as NhkSpeechReview);",
              )
              test.write_text(text, encoding='utf-8')
          PY
          fi
          rm -f .github/workflows/nhk-weekly-boss-converge-20260901.yml
          rm -f .github/workflows/nhk-weekly-boss-v1-promote.yml
          rm -f scripts/patch-nhk-weekly-boss-v1.py
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit converged implementation
        run: |
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Converge weekly NHK Boss v1" || true
          git push origin HEAD:nihongo-vercel
          git rev-parse HEAD > /tmp/implementation_commit
      - name: Wait for production deployment
        run: sleep 50
      - name: Verify production bundle and parser
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
          ARTICLE: https://www.mojidict.com/article/lzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          base = os.environ['BASE'].rstrip('/')
          article = os.environ['ARTICLE']
          def get(url, attempts=10):
              last = None
              for attempt in range(1, attempts + 1):
                  started = time.monotonic()
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'NihongoWeeklyBossConverge/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=50) as response:
                          return response.read().decode('utf-8'), round((time.monotonic() - started) * 1000)
                  except Exception as error:
                      last = error
                      time.sleep(min(attempt * 3, 15))
              raise last
          html, root_ms = get(base + '/')
          match = re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
          assert match
          javascript, asset_ms = get(urllib.parse.urljoin(base + '/', match.group(1)))
          markers = ['nihongo-nhk-weekly-boss-v1', 'WEEKLY BOSS', '-synthesis-round-5', '下周剧情']
          missing = [marker for marker in markers if marker not in javascript]
          assert not missing, f'missing markers: {missing}'
          parsed_text, parse_ms = get(base + '/api/moji-article?' + urllib.parse.urlencode({'url': article}))
          parsed = json.loads(parsed_text)
          assert parsed.get('ok') is True and len(parsed.get('sentences') or []) >= 3
          result = {
              'rootMs': root_ms,
              'assetMs': asset_ms,
              'parseMs': parse_ms,
              'sentenceCount': len(parsed['sentences']),
              'resolvedBy': parsed.get('resolvedBy'),
              'markers': markers,
          }
          with open('/tmp/boss_smoke.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Write or refresh authoritative evidence
        run: |
          mkdir -p docs/verification
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              'schemaVersion': 1,
              'result': 'PASS',
              'feature': 'NHK_WEEKLY_BOSS_V1',
              'implementationCommit': Path('/tmp/implementation_commit').read_text().strip(),
              'verifiedAt': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'sourcePolicy': {
                  'window': 'current local week',
                  'minimumUniqueExpressions': 5,
                  'source': 'completed real NHK morning sessions',
              },
              'rounds': ['daily', 'polite', 'work', 'callback', 'synthesis'],
              'choiceQuestions': 0,
              'answerPolicy': 'record first; target expression revealed only after speech analysis',
              'dynamicBehavior': 'the next round displays the prior AI character reaction and branches follow-up wording by target-expression use',
              'localPersistence': 'nihongo-nhk-weekly-boss-v1',
              'nextWeekWorldHook': True,
              'productionSmoke': json.loads(Path('/tmp/boss_smoke.json').read_text()),
          }
          Path('docs/verification/NHK_WEEKLY_BOSS_V1.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/verification/NHK_WEEKLY_BOSS_V1.json
          git commit -m "Verify weekly NHK Boss v1 in production" || true
          git push origin HEAD:nihongo-vercel
