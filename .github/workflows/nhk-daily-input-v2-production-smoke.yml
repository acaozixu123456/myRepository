name: NHK DailyInputV2 production smoke

on:
  push:
    branches: [nihongo-daily-input-v2-20260901]
    paths:
      - '.github/workflows/nhk-daily-input-v2-production-smoke.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-daily-input-v2-20260901
          fetch-depth: 0
      - name: Verify deployed UI and API contracts
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
          ARTICLE: https://www.mojidict.com/article/lzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request

          base = os.environ['BASE'].rstrip('/')
          article = os.environ['ARTICLE']

          def request_json(url, data=None, attempts=8):
              last = None
              for attempt in range(1, attempts + 1):
                  started = time.monotonic()
                  request = urllib.request.Request(
                      url,
                      data=None if data is None else json.dumps(data, ensure_ascii=False).encode('utf-8'),
                      method='GET' if data is None else 'POST',
                      headers={
                          'User-Agent': 'NihongoDailyInputV2Smoke/1.0',
                          'Cache-Control': 'no-cache',
                          **({'Content-Type': 'application/json'} if data is not None else {}),
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=70) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                          return response.status, payload, round((time.monotonic() - started) * 1000)
                  except Exception as error:
                      last = repr(error)
                      time.sleep(min(3 * attempt, 15))
              raise RuntimeError(last)

          def request_text(url, attempts=8):
              last = None
              for attempt in range(1, attempts + 1):
                  started = time.monotonic()
                  request = urllib.request.Request(url, headers={
                      'User-Agent': 'NihongoDailyInputV2Smoke/1.0',
                      'Cache-Control': 'no-cache',
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return response.status, response.read().decode('utf-8'), round((time.monotonic() - started) * 1000)
                  except Exception as error:
                      last = repr(error)
                      time.sleep(min(3 * attempt, 15))
              raise RuntimeError(last)

          root_status, html, root_ms = request_text(base + '/')
          assert root_status == 200
          asset_match = re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
          assert asset_match, 'production JS asset not found'
          asset_url = urllib.parse.urljoin(base + '/', asset_match.group(1))
          asset_status, javascript, asset_ms = request_text(asset_url)
          assert asset_status == 200
          assert 'nihongo-nhk-morning-v2' in javascript, 'DailyInputV2 storage marker missing'
          ui_text = '完整训练第 1 句'
          escaped_ui_text = json.dumps(ui_text, ensure_ascii=True)[1:-1].lower()
          assert ui_text in javascript or escaped_ui_text in javascript.lower(), 'new primary-sentence UI missing'

          parse_url = base + '/api/moji-article?' + urllib.parse.urlencode({'url': article})
          parse_status, parsed, parse_ms = request_json(parse_url)
          assert parse_status == 200 and parsed.get('ok') is True
          sentences = parsed.get('sentences') or []
          assert len(sentences) >= 3

          coach_status, coached, coach_ms = request_json(base + '/api/nhk-coach', {
              'title': parsed['title'],
              'sentences': sentences,
          })
          assert coach_status == 200 and coached.get('ok') is True
          recommendations = (coached.get('coach') or {}).get('recommendations') or []
          assert len(recommendations) == 3
          picked = [item.get('sentence') for item in recommendations]
          assert len(set(picked)) == 3
          assert all(sentence in sentences for sentence in picked)

          print(json.dumps({
              'ok': True,
              'rootMs': root_ms,
              'assetMs': asset_ms,
              'parseMs': parse_ms,
              'coachMs': coach_ms,
              'sentenceCount': len(sentences),
              'coachModel': coached.get('model'),
              'coachCached': coached.get('cached'),
              'productionMarkers': ['nihongo-nhk-morning-v2', ui_text],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Remove one-time smoke workflow after PASS
        run: |
          rm .github/workflows/nhk-daily-input-v2-production-smoke.yml
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/nhk-daily-input-v2-production-smoke.yml
          git commit -m "Remove completed DailyInputV2 production smoke"
          git push origin HEAD:nihongo-daily-input-v2-20260901
