name: Repair NHK core learning loop v2 gate

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/nhk-core-v2-rescue-20260901.yml'

permissions:
  contents: write

jobs:
  verify-record-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-vercel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Wait for all four authoritative milestones
        run: |
          python - <<'PY'
          import json, subprocess, time
          required = [
              'NHK_ENTRY_COST_V1',
              'NHK_UNSEEN_RECALL_V1',
              'NHK_WEEKLY_BOSS_V1',
              'NHK_BOSS_WORLD_BRIDGE_V1',
          ]
          last = []
          for attempt in range(1, 121):
              subprocess.run(['git','fetch','origin','nihongo-vercel'], check=True)
              subprocess.run(['git','reset','--hard','origin/nihongo-vercel'], check=True)
              last = []
              for name in required:
                  try:
                      with open(f'docs/verification/{name}.json', encoding='utf-8') as handle:
                          payload = json.load(handle)
                      if payload.get('result') != 'PASS':
                          last.append(f'{name}:not-pass')
                  except Exception as error:
                      last.append(f'{name}:{error!r}')
              if not last:
                  break
              time.sleep(10)
          else:
              raise RuntimeError('milestones did not converge: ' + '; '.join(last))
          PY
          rm -f .github/workflows/nhk-core-learning-loop-v2-gate.yml
          rm -f .github/workflows/nhk-roadmap-gate-20260901.yml
          rm -f .github/workflows/nhk-core-v2-rescue-20260901.yml
      - name: Validate evidence contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          entry = json.loads(Path('docs/verification/NHK_ENTRY_COST_V1.json').read_text())
          recall = json.loads(Path('docs/verification/NHK_UNSEEN_RECALL_V1.json').read_text())
          boss = json.loads(Path('docs/verification/NHK_WEEKLY_BOSS_V1.json').read_text())
          bridge = json.loads(Path('docs/verification/NHK_BOSS_WORLD_BRIDGE_V1.json').read_text())
          assert entry['articleCache']['scope'] == 'browser-local-only'
          assert entry['articleCache']['serverLearningStateUpload'] is False
          assert entry['acceptanceTargetMs'] == 10000
          assert {'parseSource','parseMs','coachMs','readyMs','completedMs'}.issubset(entry['metrics'])
          assert {'day1','day3','day7'}.issubset(recall['intervals'])
          assert recall['answerPolicy'] == 'hidden until learner records and reveals'
          assert boss['sourcePolicy']['minimumUniqueExpressions'] == 5
          assert boss['choiceQuestions'] == 0
          assert boss['rounds'] == ['daily','polite','work','callback','synthesis']
          assert boss['nextWeekWorldHook'] is True
          assert bridge['choiceQuestions'] == 0
          assert bridge['audioPersistence'] is False
          assert len(bridge['flow']) == 5
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify stable production contract
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
          ARTICLE: https://www.mojidict.com/article/lzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          base = os.environ['BASE'].rstrip('/')
          article = os.environ['ARTICLE']
          def get(url, attempts=10):
              last = None
              for attempt in range(1, attempts + 1):
                  started = time.monotonic()
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent':'NihongoCoreV2StableGate/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request, timeout=50) as response:
                          return response.read().decode('utf-8'), round((time.monotonic()-started)*1000)
                  except Exception as error:
                      last = error
                      time.sleep(min(attempt * 3, 15))
              raise last
          html, root_ms = get(base + '/')
          match = re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
          assert match
          javascript, asset_ms = get(urllib.parse.urljoin(base + '/', match.group(1)))
          stable_markers = [
              'nihongo-moji-article-cache-v1',
              'nihongo-nhk-entry-metrics-v1',
              '-recall-d1', '-recall-d3', '-recall-d7',
              'nihongo-nhk-weekly-boss-v1',
              'WEEKLY BOSS', '日常', '礼貌', '工作', '回调', '综合', '下周剧情',
              'nihongo-nhk-boss-world-bridge-v1',
              '-next-week-world', '上周 Boss 的后续', '改变本周剧情',
          ]
          missing = [marker for marker in stable_markers if marker not in javascript]
          assert not missing, f'missing production markers: {missing}'
          parse_text, parse_ms = get(base + '/api/moji-article?' + urllib.parse.urlencode({'url': article}))
          parsed = json.loads(parse_text)
          assert parsed.get('ok') is True and len(parsed.get('sentences') or []) >= 3
          health_text, health_ms = get(base + '/api/healthcheck')
          health = json.loads(health_text)
          assert health.get('ok') is True
          result = {
              'rootMs': root_ms,
              'assetMs': asset_ms,
              'parseMs': parse_ms,
              'healthMs': health_ms,
              'sentenceCount': len(parsed['sentences']),
              'resolvedBy': parsed.get('resolvedBy'),
              'markers': stable_markers,
          }
          with open('/tmp/core_v2_stable_smoke.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Record final V2 evidence and self-clean
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          names = [
              'NHK_ENTRY_COST_V1',
              'NHK_UNSEEN_RECALL_V1',
              'NHK_WEEKLY_BOSS_V1',
              'NHK_BOSS_WORLD_BRIDGE_V1',
          ]
          evidence = {name: json.loads(Path(f'docs/verification/{name}.json').read_text()) for name in names}
          payload = {
              'schemaVersion': 2,
              'result': 'PASS',
              'feature': 'NHK_CORE_LEARNING_LOOP_V2',
              'productionCommit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'verifiedAt': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'milestones': {name: evidence[name].get('result') for name in names},
              'loop': [
                  'real NHK input and automatic analysis',
                  'speech-first shadowing and output feedback',
                  'causal continuous-world use',
                  'day 1 3 and 7 unseen recall',
                  'weekly five-round no-choice Boss',
                  'next-week causal callback from Boss results',
                  'local entry and learning evidence',
              ],
              'privacy': {
                  'microphoneAudioPersisted': False,
                  'entryMetricsScope': 'browser-local-only',
                  'articleCacheScope': 'browser-local-only',
              },
              'build': {'typecheck': 'PASS', 'tests': 'PASS', 'productionBuild': 'PASS'},
              'productionSmoke': json.loads(Path('/tmp/core_v2_stable_smoke.json').read_text()),
              'notYetProven': [
                  'real learner four-days-per-week retention',
                  'day-7 improvement across enough real sessions',
                  'actual iPhone MOJi share-path acceptance',
              ],
          }
          Path('docs/verification/NHK_CORE_LEARNING_LOOP_V2.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Verify NHK core learning loop v2 with stable contracts" || true
          git push origin HEAD:nihongo-vercel
