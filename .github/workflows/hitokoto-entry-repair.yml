name: HITOKOTO installed entry repair
on:
  push:
    branches: [hitokoto-entry-repair-20260911, nihongo-vercel]
    paths:
      - scripts/repair-hitokoto-entry.py
      - scripts/refine-hitokoto-entry.py
      - scripts/hitokoto-entry-browser.mjs
      - src/appEntry.test.ts
      - src/appWorker.ts
      - public/app-entry.js
      - public/sw.js
      - public/manifest.webmanifest
      - src/main.tsx
      - src/companion/main.tsx
      - .github/workflows/hitokoto-entry-repair.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hitokoto-entry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply inspected launch repair only on the repair branch
        run: |
          mkdir -p artifacts/hitokoto-entry
          if [ "$GITHUB_REF_NAME" = hitokoto-entry-repair-20260911 ]; then
            if [ ! -f public/app-entry.js ]; then python scripts/repair-hitokoto-entry.py; fi
            python scripts/refine-hitokoto-entry.py
          fi
          test -f public/app-entry.js
          git diff --check
          git diff --exit-code d79cfbd651bf45e69e6941133038beccca95c99d -- api server supabase package.json package-lock.json src/companion/connection.ts src/companion/model.ts src/companion/prompt.ts src/companion/writtenLane.ts src/companion/writtenFeedback.ts src/NhkMorningPage.tsx src/nhkBackup.ts src/nhkLibrary.ts
          git diff --stat | tee artifacts/hitokoto-entry/changes.txt
      - run: npm ci --no-audit --no-fund
      - name: Full source tests and build
        run: |
          npm run typecheck 2>&1 | tee artifacts/hitokoto-entry/typecheck.log
          npm test 2>&1 | tee artifacts/hitokoto-entry/tests.log
          npm run build 2>&1 | tee artifacts/hitokoto-entry/build.log
      - name: Browser setup
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/hitokoto-entry-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Preserve previous voice and repeated-hint UI behavior
        run: |
          node scripts/companion-phone.mjs
          node scripts/hitokoto-neon-phone.mjs
      - name: Actual app launch, real offline shells and synthetic saved-data preservation
        run: node scripts/hitokoto-entry-browser.mjs
      - name: Commit tested entry changes without publishing
        if: github.ref_name == 'hitokoto-entry-repair-20260911'
        run: |
          git config user.name 'Sol supervisor'
          git config user.email '331004814@qq.com'
          git add public/app-entry.js public/sw.js public/manifest.webmanifest src/appWorker.ts src/main.tsx src/companion/main.tsx src/companion/CompanionApp.tsx src/App.tsx src/appEntry.test.ts index.html companion.html vercel.json scripts/nhk-calm-browser.mjs scripts/nhk-reliability-browser.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Route installed app launches to HITOKOTO; preserve NHK shares and isolate shell caches'
            git push origin HEAD:hitokoto-entry-repair-20260911
          fi
          git rev-parse HEAD > artifacts/hitokoto-entry/tested-source.txt
      - name: Audit exact served launcher, manifest, worker and companion
        if: github.ref_name == 'nihongo-vercel'
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile,mkdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const base='https://nihongo-discovery-v2-20260831.vercel.app';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const pages={'/':'index.html','/index.html':'index.html','/?view=nhk':'index.html','/companion.html':'companion.html'};
          const assets=new Set(['/app-entry.js','/sw.js','/manifest.webmanifest']);
          for(const file of new Set(Object.values(pages))){const html=await readFile('dist/'+file,'utf8');for(const m of html.matchAll(/(?:src|href)="(\/assets\/[^"<>]+\.(?:js|css))"/g))assets.add(m[1]);}
          const expected=await Promise.all([...assets].map(async p=>({path:p,hash:hash(await readFile('dist'+p))})));
          let passed=false,last='';
          for(let attempt=0;attempt<30;attempt++){
            try{
              for(const [path,file] of Object.entries(pages)){const r=await fetch(base+path,{cache:'no-store',signal:AbortSignal.timeout(12000)});assert.equal(r.status,200);assert.equal(hash(Buffer.from(await r.arrayBuffer())),hash(await readFile('dist/'+file)),path);}
              for(const item of expected){const r=await fetch(base+item.path,{cache:'no-store',signal:AbortSignal.timeout(12000)});assert.equal(r.status,200);assert.equal(hash(Buffer.from(await r.arrayBuffer())),item.hash,item.path);}
              passed=true;break;
            }catch(e){last=e.message;await new Promise(r=>setTimeout(r,4000));}
          }
          assert.ok(passed,last);
          const report={release:'entry-20260911',source:process.env.GITHUB_SHA,base,productionAssetsVerified:true,checkedAt:new Date().toISOString(),paths:Object.keys(pages),assets:expected};
          await writeFile('artifacts/hitokoto-entry/production-assets.json',JSON.stringify(report,null,2));console.log('PRODUCTION_ENTRY_ASSETS',JSON.stringify(report));
          JS
          ENTRY_BASE_URL=https://nihongo-discovery-v2-20260831.vercel.app ENTRY_EVIDENCE_DIR=artifacts/hitokoto-entry-production node scripts/hitokoto-entry-browser.mjs
      - name: Record production evidence
        if: github.ref_name == 'nihongo-vercel'
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile,mkdir} from 'node:fs/promises';
          const assets=JSON.parse(await readFile('artifacts/hitokoto-entry/production-assets.json','utf8'));
          const browser=JSON.parse(await readFile('artifacts/hitokoto-entry-production/result.json','utf8'));
          const tests=(await readFile('artifacts/hitokoto-entry/tests.log','utf8')).replace(/\u001b\[[0-9;]*m/g,'');
          const report={...assets,browser,testsPassed:Number(tests.match(/Tests\s+(\d+) passed/)?.[1]||0),physicalIPhoneTested:false,run:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`};
          await mkdir('docs/qa',{recursive:true});await writeFile('docs/qa/HITOKOTO_ENTRY_20260911.json',JSON.stringify(report,null,2)+'\n');
          JS
          git fetch origin nihongo-vercel
          if [ "$(git rev-parse origin/nihongo-vercel)" = "$GITHUB_SHA" ]; then
            git config user.name 'Sol supervisor'
            git config user.email '331004814@qq.com'
            git add docs/qa/HITOKOTO_ENTRY_20260911.json
            git commit -m 'Record verified real default launch and preserved NHK data paths'
            git push origin HEAD:nihongo-vercel
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitokoto-entry-${{ github.run_id }}
          path: |
            artifacts/hitokoto-entry/
            artifacts/hitokoto-entry-production/
            artifacts/companion-phone/
            artifacts/hitokoto-neon/
            docs/qa/HITOKOTO_ENTRY_20260911.json
