name: Sol Living Scene Visual Review Evidence
on:
  push:
    branches: [nihongo-living-scene-local-20260906]
    paths: ['.github/workflows/sol-living-scene-review-artifact.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify delivered visual evidence exists
        run: |
          test -s docs/living-scene/evidence/hero-desktop.png
          test -s docs/living-scene/evidence/subtitle.png
          test -s docs/living-scene/evidence/parallax-left.png
          test -s docs/living-scene/evidence/parallax-right.png
          test -s docs/living-scene/evidence/asset-pipeline.png
          test -s docs/living-scene/evidence/browser-tour.mp4
          sha256sum docs/living-scene/evidence/hero-desktop.png docs/living-scene/evidence/browser-tour.mp4 > /tmp/evidence-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: living-scene-sol-review
          path: |
            docs/living-scene/evidence/hero-desktop.png
            docs/living-scene/evidence/subtitle.png
            docs/living-scene/evidence/parallax-left.png
            docs/living-scene/evidence/parallax-right.png
            docs/living-scene/evidence/hover.png
            docs/living-scene/evidence/asset-pipeline.png
            docs/living-scene/evidence/browser-tour.mp4
            /tmp/evidence-sha256.txt
          retention-days: 3
