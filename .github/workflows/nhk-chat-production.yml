name: NHK random chat production mobile acceptance
on:
  push:
    branches: [nihongo-vercel]
    paths: ['.github/workflows/nhk-chat-production.yml','scripts/nhk-chat-production.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Deployed assets, origin, consent, source validation and legacy route
        run: node scripts/nhk-chat-production.mjs
      - name: Real production proxy and synthetic speech, phone-size client
        run: |
          node scripts/nhk-chat-live-diagnostics.mjs
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/chat-production.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          LIVE_PROXY=1 node scripts/nhk-chat-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhk-chat-production
          path: |
            artifacts/chat-production/
            artifacts/chat-live/
          if-no-files-found: ignore
