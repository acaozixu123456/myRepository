name: Apply NHK Reading Studio Bundle

on:
  push:
    branches: [nihongo-nhk-reading-studio-20260903]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild verified source bundle
        shell: bash
        run: |
          cat .github/nhk-reading-studio-payload/part-* > /tmp/nhk-reading-studio.tar.gz.b64
          base64 --decode /tmp/nhk-reading-studio.tar.gz.b64 > /tmp/nhk-reading-studio.tar.gz
          echo "e7b7695a79ff1f3f2dde663b45d6510ecf0f4cca288875feeba8ef3274722eee  /tmp/nhk-reading-studio.tar.gz" | sha256sum --check
          tar -xzf /tmp/nhk-reading-studio.tar.gz
          rm -rf .github/nhk-reading-studio-payload
          rm -f .github/workflows/apply-nhk-reading-studio.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build NHK article reading studio"
          git push origin "HEAD:${GITHUB_REF_NAME}"
