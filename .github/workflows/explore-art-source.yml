name: Exploration Art Source Snapshot
on:
  push:
    branches: [nihongo-desktop-art-20260906]
    paths: ['.github/workflows/explore-art-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/art-source
          git archive --format=tar.gz HEAD > /tmp/art-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: explore-art-source
          path: /tmp/art-source/
          retention-days: 3
