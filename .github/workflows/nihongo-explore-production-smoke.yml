name: Nihongo Exploration Production Smoke
on:
  push:
    branches: [nihongo-vercel]
    paths: ['src/explore/**', 'public/explore/**', 'explore.html']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nihongo-explore-production-smoke
  cancel-in-progress: false
jobs:
  verify-production:
    if: github.ref == 'refs/heads/nihongo-vercel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          mkdir -p /tmp/explore-artifacts
          git rev-parse HEAD > /tmp/explore-artifacts/source-sha.txt
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tee /tmp/explore-artifacts/build.log
      - name: Verify both independent entrypoints and exact deployed content
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,time,urllib.request
          base='https://nihongo-discovery-v2-20260831.vercel.app'
          dist=pathlib.Path('dist')
          pages={name:re.findall(r'(?:src|href)="(/assets/[^\"]+)"',(dist/name).read_text()) for name in ['index.html','explore.html']}
          assets=set(x for paths in pages.values() for x in paths)
          expected={p:hashlib.sha256((dist/p.lstrip('/')).read_bytes()).hexdigest() for p in assets}
          for p in ['/sw.js','/explore/map-source.json','/explore/yanaka-roads.geojson']:
              expected[p]=hashlib.sha256((dist/p.lstrip('/')).read_bytes()).hexdigest()
          report={'commit':os.environ['GITHUB_SHA'],'base':base,'expected':expected,'attempts':[]}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                  assert r.status==200
                  return r.read()
          for attempt in range(18):
              try:
                  for page,paths in pages.items():
                      html=get(('/' if page=='index.html' else '/explore.html')+'?verify='+os.environ['GITHUB_SHA']).decode()
                      assert all(p in html for p in paths),f'{page} not on expected revision'
                  actual={p:hashlib.sha256(get(p)).hexdigest() for p in expected}
                  assert actual==expected,'deployed content hash mismatch'
                  report.update(status='PASS',actual=actual,verifiedAt=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()));break
              except Exception as error:
                  report['attempts'].append({'n':attempt+1,'error':str(error)})
                  print('Release convergence',attempt+1,str(error),flush=True)
                  if attempt<17:time.sleep(10)
          else:report['status']='FAIL'
          pathlib.Path('/tmp/explore-artifacts/production-release.json').write_text(json.dumps(report,indent=2))
          assert report['status']=='PASS'
          PY
      - name: Exercise deployed game with synthetic saves and mocked speech failures
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          EXPLORE_BASE=https://nihongo-discovery-v2-20260831.vercel.app node scripts/explore-browser.mjs 2>&1 | tee /tmp/explore-artifacts/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nihongo-explore-production-${{ github.run_number }}
          path: /tmp/explore-artifacts/
          retention-days: 14
