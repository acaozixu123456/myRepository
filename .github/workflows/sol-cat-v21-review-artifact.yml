name: Sol Cat V2.1 Review Evidence
on:
  push:
    branches: [nihongo-living-scene-cat-v21-local-20260906]
    paths: ['.github/workflows/sol-cat-v21-review-artifact.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Cat V2.1 evidence
        run: |
          test -s docs/living-scene/cat-v21/evidence/hero-clean.png
          test -s docs/living-scene/cat-v21/evidence/departure.png
          test -s docs/living-scene/cat-v21/evidence/turning.png
          test -s docs/living-scene/cat-v21/evidence/mid-walk.png
          test -s docs/living-scene/cat-v21/evidence/settling.png
          test -s docs/living-scene/cat-v21/evidence/arrival.png
          test -s docs/living-scene/cat-v21/evidence/atlas-mattes.png
          test -s docs/living-scene/cat-v21/evidence/browser-tour.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cat-v21-sol-review
          path: |
            docs/living-scene/cat-v21/evidence/hero-clean.png
            docs/living-scene/cat-v21/evidence/departure.png
            docs/living-scene/cat-v21/evidence/turning.png
            docs/living-scene/cat-v21/evidence/mid-walk.png
            docs/living-scene/cat-v21/evidence/approach-hold.png
            docs/living-scene/cat-v21/evidence/settling.png
            docs/living-scene/cat-v21/evidence/arrival.png
            docs/living-scene/cat-v21/evidence/cat-attentive.png
            docs/living-scene/cat-v21/evidence/cat-purring.png
            docs/living-scene/cat-v21/evidence/atlas-mattes.png
            docs/living-scene/cat-v21/evidence/browser-tour.mp4
            docs/living-scene/cat-v21/evidence/browser-report.json
            docs/living-scene/cat-v21/evidence/transition-checks.json
          retention-days: 3
