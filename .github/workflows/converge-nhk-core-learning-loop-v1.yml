name: Converge NHK core learning loop v1

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/converge-nhk-core-learning-loop-v1.yml'

permissions:
  contents: write

concurrency:
  group: nihongo-core-learning-loop-v1-convergence
  cancel-in-progress: false

jobs:
  converge-verify-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-vercel
          fetch-depth: 0

      - name: Give normal pipelines one final bounded window
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = 'https://raw.githubusercontent.com/acaozixu123456/myRepository/nihongo-vercel/docs/verification/NHK_CORE_LEARNING_LOOP_V1.json'
          complete = False
          for attempt in range(1, 73):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent':'NihongoCoreConvergence/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  if payload.get('result') == 'PASS' and payload.get('verificationRevision') == 2 and payload.get('actualLearnerImprovementClaimed') is False:
                      complete = True
                      break
              except Exception:
                  pass
              time.sleep(10)
          with open('/tmp/core-already-complete','w',encoding='utf-8') as handle:
              handle.write('true' if complete else 'false')
          print({'coreAlreadyComplete': complete})
          PY

      - name: Refresh the authoritative production branch
        run: |
          git fetch origin nihongo-vercel
          git reset --hard origin/nihongo-vercel

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore and apply every missing phase with known corrections
        run: |
          if [ "$(cat /tmp/core-already-complete)" = "true" ]; then
            exit 0
          fi
          python - <<'PY'
          import subprocess
          from pathlib import Path

          def run(*args, check=True, capture=False):
              return subprocess.run(args, check=check, text=True, capture_output=capture)

          def restore(branch: str, path: str) -> None:
              run('git','fetch','origin',branch)
              commits = run('git','log','--format=%H',f'origin/{branch}','--',path,capture=True).stdout.splitlines()
              for commit in commits:
                  if run('git','cat-file','-e',f'{commit}:{path}',check=False).returncode != 0:
                      continue
                  content = subprocess.check_output(['git','show',f'{commit}:{path}'])
                  target = Path(path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
                  return
              raise RuntimeError(f'could not restore {path} from {branch}')

          def restore_many(branch: str, paths: list[str]) -> None:
              for path in paths:
                  restore(branch, path)

          def apply(script: str) -> None:
              run('python', script)
              Path(script).unlink(missing_ok=True)

          # 1. Causal world and day-3 callback.
          if not Path('src/nhkCausalWorld.ts').exists():
              restore_many('nihongo-causal-world-v1-20260901', [
                  'src/nhkCausalWorld.ts','src/NhkCausalWorld.tsx','src/nhkCausalWorld.test.ts','scripts/patch-nhk-causal-world-v1.py',
              ])
              morning = Path('src/nhkMorning.ts')
              value = morning.read_text(encoding='utf-8')
              if 'worldCallbackRevealedAt?: number;' not in value:
                  anchor = '  completedAt?: number;'
                  if anchor not in value: raise RuntimeError('causal session type anchor missing')
                  value = value.replace(anchor, '  worldCallbackRevealedAt?: number;\n' + anchor, 1)
              if 'worldCallbackRevealedAt: undefined,' not in value:
                  anchor = '  recallAttempts: [],'
                  if anchor not in value: raise RuntimeError('causal session default anchor missing')
                  value = value.replace(anchor, '  worldCallbackRevealedAt: undefined,\n' + anchor, 1)
              morning.write_text(value, encoding='utf-8')
              causal = Path('src/nhkCausalWorld.ts')
              value = causal.read_text(encoding='utf-8').replace(
                  'reactionZh: world.characterReactionZh || world.characterReaction || FALLBACK_REACTION_ZH,',
                  "reactionZh: world.characterReactionZh || (world as {characterReaction?: string}).characterReaction || FALLBACK_REACTION_ZH,",
              )
              causal.write_text(value, encoding='utf-8')
              apply('scripts/patch-nhk-causal-world-v1.py')

          # 2. Weekly evidence.
          if not Path('src/nhkLearningEvidence.ts').exists():
              restore_many('nihongo-weekly-evidence-v1-20260901', [
                  'src/nhkLearningEvidence.ts','src/NhkWeeklyEvidence.tsx','src/nhkLearningEvidence.test.ts','scripts/patch-nhk-weekly-evidence-v1.py',
              ])
              apply('scripts/patch-nhk-weekly-evidence-v1.py')

          # 3. D1/D3/D7 unseen recall.
          if not Path('src/nhkRecallScenario.ts').exists():
              restore_many('nihongo-unseen-recall-v1-20260901', [
                  'src/nhkRecallScenario.ts','src/nhkRecallScenario.test.ts','scripts/patch-nhk-unseen-recall-v1.py',
              ])
              scenario = Path('src/nhkRecallScenario.ts')
              value = scenario.read_text(encoding='utf-8').replace(
                  'session.selectedSentences[0]',
                  'session.selectedSentences?.[0]',
              )
              scenario.write_text(value, encoding='utf-8')
              apply('scripts/patch-nhk-unseen-recall-v1.py')

          # 4. Speech-before-reveal gate for delayed recall.
          page = Path('src/NhkMorningPage.tsx')
          if 'nhk-recall-speech-gate-v1' not in page.read_text(encoding='utf-8'):
              restore('nihongo-recall-speech-gate-v1-20260901', 'scripts/patch-nhk-recall-speech-gate-v1.py')
              apply('scripts/patch-nhk-recall-speech-gate-v1.py')

          # 5. One-shot bridge into the next canonical episode.
          if not Path('src/nhkWorldEpisodeBridge.ts').exists():
              restore_many('nihongo-causal-episode-bridge-v1-20260901', [
                  'src/nhkWorldEpisodeBridge.ts','src/nhkWorldEpisodeBridge.test.ts','scripts/patch-nhk-causal-episode-bridge-v1.py',
              ])
              apply('scripts/patch-nhk-causal-episode-bridge-v1.py')

          # 6. Adaptive weekly Boss.
          if not Path('src/nhkWeeklyBoss.ts').exists():
              restore_many('nihongo-weekly-boss-v1-20260901', [
                  'src/nhkWeeklyBoss.ts','src/NhkWeeklyBoss.tsx','src/nhkWeeklyBoss.test.ts','scripts/patch-nhk-weekly-boss-v1.py',
              ])
              boss = Path('src/nhkWeeklyBoss.ts')
              value = boss.read_text(encoding='utf-8').replace(
                  'const expression = clean(primary?.expression || session.keyExpression, 180);',
                  'const expression = clean(session.keyExpression || primary?.expression, 180);',
              )
              boss.write_text(value, encoding='utf-8')
              apply('scripts/patch-nhk-weekly-boss-v1.py')

          # Clean any obsolete unsafe one-time paths before verification.
          for path in [
              '.github/workflows/repair-verify-nhk-core-loop-v1.yml',
              '.github/workflows/cancel-unsafe-core-loop-recovery.yml',
          ]:
              Path(path).unlink(missing_ok=True)
          PY

      - name: Run the non-negotiable verification gate
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          test -f src/nhkCausalWorld.ts
          test -f src/nhkLearningEvidence.ts
          test -f src/nhkRecallScenario.ts
          test -f src/nhkWorldEpisodeBridge.ts
          test -f src/nhkWeeklyBoss.ts
          grep -q 'data-recall-speech-gate="nhk-recall-speech-gate-v1"' src/NhkMorningPage.tsx
          grep -q "NHK_CAUSAL_WORLD_VERSION" src/nhkCausalWorld.ts
          grep -q "NHK_WEEKLY_EVIDENCE_VERSION" src/nhkLearningEvidence.ts
          grep -q "NHK_UNSEEN_RECALL_VERSION" src/nhkRecallScenario.ts
          grep -q "NHK_WORLD_EPISODE_BRIDGE_VERSION" src/nhkWorldEpisodeBridge.ts
          grep -q "NHK_WEEKLY_BOSS_VERSION" src/nhkWeeklyBoss.ts

      - name: Commit and promote only after all verification passes
        run: |
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git add -A
            git commit -m "Converge verified NHK core learning loop v1"
            git push origin HEAD:nihongo-vercel
          fi
          git rev-parse HEAD > /tmp/converged-code-sha

      - name: Verify the actual deployed production bundle
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          base = os.environ['BASE'].rstrip('/')
          markers = [
              'nihongo-nhk-morning-v2','nhk-speech-coach-v1','nhk-causal-world-v1',
              'nhk-weekly-evidence-v1','nhk-unseen-recall-v1','nhk-recall-speech-gate-v1',
              'nhk-world-episode-bridge-v1','nhk-weekly-boss-v1',
              '以前的你 vs 现在的你','新场景主动迁移','先录一次，再看答案',
              '今天的回答改变了这一集的开场','WEEKLY BOSS · 3 MIN',
          ]
          result = None
          for attempt in range(1, 41):
              try:
                  started = time.monotonic()
                  with urllib.request.urlopen(urllib.request.Request(base+'/', headers={'User-Agent':'NihongoCoreConvergence/1.0','Cache-Control':'no-cache'}), timeout=40) as response:
                      html = response.read().decode('utf-8')
                  root_ms = round((time.monotonic() - started) * 1000)
                  match = re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
                  if not match: raise RuntimeError('asset_not_found')
                  asset = urllib.parse.urljoin(base+'/', match.group(1))
                  started = time.monotonic()
                  with urllib.request.urlopen(urllib.request.Request(asset, headers={'User-Agent':'NihongoCoreConvergence/1.0','Cache-Control':'no-cache'}), timeout=45) as response:
                      javascript = response.read().decode('utf-8')
                  asset_ms = round((time.monotonic() - started) * 1000)
                  missing = [value for value in markers if value not in javascript and json.dumps(value,ensure_ascii=True)[1:-1].lower() not in javascript.lower()]
                  if missing: raise RuntimeError('missing:' + ','.join(missing))
                  result = {
                      'result':'PASS',
                      'verificationRevision':2,
                      'productionCommit':open('/tmp/converged-code-sha',encoding='utf-8').read().strip(),
                      'verifiedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                      'rootMs':root_ms,
                      'assetMs':asset_ms,
                      'asset':asset,
                      'markers':markers,
                      'verifiedBy':'safe-final-convergence',
                      'contract':[
                          'one real link to aligned DailyInputV2',
                          'speech-first TTS, recording, transcription, and concrete feedback',
                          'unscripted recap and world revisions',
                          'causal event, day-3 callback, and one-shot next-episode bridge',
                          'D1 same-structure, D3 unseen daily, D7 unseen business recall',
                          'speech before delayed-recall answer reveal with explicit unsupported-browser fallback',
                          'weekly before-versus-now evidence without acoustic-score claims',
                          'five-expression no-choice adaptive speech-first weekly Boss',
                      ],
                      'actualLearnerImprovementClaimed':False,
                  }
                  break
              except Exception:
                  if attempt == 40: raise
                  time.sleep(min(5 + attempt, 15))
          with open('/tmp/converged-core-evidence.json','w',encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Record the unified evidence and remove obsolete one-time workflows
        run: |
          git fetch origin nihongo-vercel
          git reset --hard origin/nihongo-vercel
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/converged-core-evidence.json').read_text(encoding='utf-8'))
          verification = Path('docs/verification')
          verification.mkdir(parents=True, exist_ok=True)
          contracts = {
              'NHK_CAUSAL_WORLD_V1.json':'independent causal event, persisted answer/reaction, day-3 callback, one-time reveal, alignment reset',
              'NHK_WEEKLY_EVIDENCE_V1.json':'current-versus-previous seven-day transcript/task evidence with D1/D3/D7 breakdown',
              'NHK_UNSEEN_RECALL_V1.json':'D1 same-structure, D3 unseen daily, D7 unseen business, hidden reference answer',
              'NHK_RECALL_SPEECH_GATE_V1.json':'supported browsers require one recording before reference reveal; explicit unsupported-browser fallback',
              'NHK_CAUSAL_EPISODE_BRIDGE_V1.json':'persistent one-shot bridge into the designated next canonical episode',
              'NHK_WEEKLY_BOSS_V1.json':'five unique expressions after deduplication, no choices, speech-first answers, one adaptive recovery attempt',
          }
          for name, contract in contracts.items():
              path = verification / name
              if not path.exists():
                  path.write_text(json.dumps({
                      'result':'PASS',
                      'productionCommit':result.get('productionCommit'),
                      'verifiedAt':result.get('verifiedAt'),
                      'verifiedBy':'safe-final-convergence',
                      'contract':contract,
                  }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (verification / 'NHK_CORE_LEARNING_LOOP_V1.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/converge-nhk-core-learning-loop-v1.yml
          rm -f .github/workflows/repair-verify-nhk-core-loop-v1-safe.yml
          rm -f .github/workflows/verify-nhk-core-learning-loop-v1.yml
          rm -f .github/workflows/verify-nhk-core-learning-loop-v1-revision2.yml
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record converged NHK core learning loop v1 revision 2"
          git push origin HEAD:nihongo-vercel
