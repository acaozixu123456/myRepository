name: Nihongo Exploration NHK Regression
on:
  push:
    branches: [nihongo-explore-slice-20260906]
    paths: ['.github/workflows/nihongo-explore-regression.yml','scripts/explore-regression-trigger.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nihongo-explore-regression
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          mkdir -p /tmp/nhk-artifacts
          git rev-parse HEAD > /tmp/nhk-artifacts/source-sha.txt
          npm ci --no-audit --no-fund
          npm run build
          npm install --no-save --package-lock=false --no-audit --no-fund playwright @axe-core/playwright
          npx playwright install --with-deps chromium webkit
      - name: Preserve old NHK learning, backup and restore flows
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nhk-artifacts/preview.log 2>&1 &
          NHK_BASE_URL=http://127.0.0.1:4173 timeout 210s node scripts/nhk-reliability-browser.mjs 2>&1 | tee /tmp/nhk-artifacts/reliability-browser.txt
          NHK_TEST_BASE=http://127.0.0.1:4173 timeout 210s node scripts/nhk-calm-browser.mjs 2>&1 | tee /tmp/nhk-artifacts/browser-log.txt
      - name: Check one curated line with the REAL existing production speech service
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {chromium} from 'playwright';
          const text='お弁当、温めますか。';
          const report={scope:'One curated fictional NPC line; real production TTS, real audio download and browser audio decode. Not a pronunciation or real-iPhone acceptance.',inputText:text,aiRequests:1};let browser;
          try {
            const response=await fetch('https://nihongo-discovery-v2-20260831.vercel.app/api/nhk-speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'tts',text}),signal:AbortSignal.timeout(45000)});
            report.httpStatus=response.status;const body=await response.json();
            assert(response.ok&&body.ok,JSON.stringify(body));
            const url=new URL(body.url);assert.equal(url.hostname,'kivebsjsdfdobxzaokbj.supabase.co');assert.equal(url.protocol,'https:');
            const audio=await fetch(url,{signal:AbortSignal.timeout(20000)});assert(audio.ok);const bytes=Buffer.from(await audio.arrayBuffer());assert(bytes.length>1000);
            report.audioBytes=bytes.length;report.contentType=audio.headers.get('content-type');report.model=body.model;report.cached=body.cached;
            browser=await chromium.launch();const page=await browser.newPage();
            report.decoded=await page.evaluate(async(b64)=>{const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const context=new AudioContext();const buffer=await context.decodeAudioData(bytes.buffer);const result={duration:buffer.duration,sampleRate:buffer.sampleRate,channels:buffer.numberOfChannels};await context.close();return result;},bytes.toString('base64'));
            assert(report.decoded.duration>.3);report.status='PASS';
          } catch(error) {report.status='FAIL';report.error=String(error);process.exitCode=1;} finally {await browser?.close();writeFileSync('/tmp/nhk-artifacts/explore-real-audio.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nihongo-explore-nhk-regression-${{ github.run_number }}
          path: /tmp/nhk-artifacts/
          retention-days: 7
