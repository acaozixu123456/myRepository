name: NHK turn support production mobile gate
on:
  push:
    branches: [nihongo-vercel]
    paths: [.github/workflows/nhk-turn-support-production.yml, scripts/nhk-turn-support-production.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - name: Verify exact promoted assets and unchanged voice proxy
        run: node scripts/nhk-turn-support-production.mjs
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - name: Phone-sized actual API and synthetic voice with current-turn hints
        env:
          LIVE_PROXY: '1'
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/turn-support-production-vite.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          node scripts/nhk-chat-live-diagnostics.mjs
          node scripts/nhk-turn-support-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhk-turn-support-production
          path: |
            artifacts/turn-support-production/
            artifacts/chat-live/
          if-no-files-found: warn
