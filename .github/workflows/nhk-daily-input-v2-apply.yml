name: Apply NHK DailyInputV2

on:
  push:
    branches: [nihongo-daily-input-v2-20260901]
    paths:
      - '.github/workflows/nhk-daily-input-v2-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-daily-input-v2-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply UI migration
        run: python scripts/patch-nhk-daily-input-v2.py
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified feature and remove one-time files
        run: |
          rm scripts/patch-nhk-daily-input-v2.py
          rm .github/workflows/nhk-daily-input-v2-apply.yml
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add src/NhkMorningPage.tsx scripts/patch-nhk-daily-input-v2.py .github/workflows/nhk-daily-input-v2-apply.yml
          git commit -m "Persist aligned NHK DailyInputV2"
          git push origin HEAD:nihongo-daily-input-v2-20260901
