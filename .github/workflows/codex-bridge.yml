name: HITOKOTO Codex subscription bridge
on:
  push:
    branches: [hitokoto-codex-bridge-20260912]
    paths: ['local/codex-bridge/**','scripts/codex-bridge-smoke.mjs','.github/workflows/codex-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and protocol smoke with fake official app-server surface
        run: |
          node --check local/codex-bridge/server.mjs
          node --check local/codex-bridge/fake-codex.mjs
          node scripts/codex-bridge-smoke.mjs
      - name: Assert no metered companion fallback exists in bridge source
        run: |
          ! grep -R "platform.openai.com\|api.openai.com\|OPENAI_API_KEY" local/codex-bridge
          grep -q "apiFallback:false" local/codex-bridge/server.mjs
          grep -q "127.0.0.1" local/codex-bridge/server.mjs
