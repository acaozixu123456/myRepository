name: NHK share coach smoke once

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/nhk-share-coach-smoke-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production share, parser and coach
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
          ARTICLE: https://www.mojidict.com/article/lzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          base = os.environ['BASE']
          article = os.environ['ARTICLE']

          def get(url, attempts=6):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'NihongoProductionSmoke/1.1','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=40) as response:
                          return response.status, dict(response.headers.items()), response.read()
                  except Exception as error:
                      last = repr(error)
                      time.sleep(4)
              raise RuntimeError(f'GET failed: {url}: {last}')

          def post_json(url, payload, attempts=4):
              last = None
              encoded = json.dumps(payload, ensure_ascii=False).encode('utf-8')
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      url,
                      data=encoded,
                      method='POST',
                      headers={'User-Agent':'NihongoProductionSmoke/1.1','Content-Type':'application/json'},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=70) as response:
                          return response.status, json.loads(response.read().decode('utf-8'))
                  except urllib.error.HTTPError as error:
                      body = error.read().decode('utf-8', errors='replace')
                      last = f'HTTP {error.code}: {body}'
                  except Exception as error:
                      last = repr(error)
                  time.sleep(5)
              raise RuntimeError(f'POST failed: {url}: {last}')

          status, _, body = get(base + '/manifest.webmanifest')
          assert status == 200
          manifest = json.loads(body.decode('utf-8'))
          assert manifest['share_target']['action'] == '/?share_target=1'
          assert manifest['share_target']['params']['url'] == 'url'
          assert manifest['start_url'] == '/'

          status, _, body = get(base + '/sw.js')
          assert status == 200
          assert b"addEventListener('fetch'" in body

          share_url = base + '/?' + urllib.parse.urlencode({'share_target':'1','url':article})
          status, _, body = get(share_url)
          html = body.decode('utf-8', errors='replace')
          assert status == 200 and 'id="root"' in html and 'manifest.webmanifest' in html

          parse_url = base + '/api/moji-article?' + urllib.parse.urlencode({'url':article})
          status, _, body = get(parse_url)
          parsed = json.loads(body.decode('utf-8'))
          assert status == 200 and parsed.get('ok') is True
          assert parsed.get('resolvedBy') == 'public-nhk-archive'
          sentences = parsed.get('sentences') or []
          assert len(sentences) >= 5
          assert '子どものSNSの使い方が' in sentences[0]
          assert all('石田彰' not in sentence and 'セロ弾き' not in sentence for sentence in sentences)

          coach_status, coach_payload = post_json(
              base + '/api/nhk-coach',
              {'title': parsed['title'], 'sentences': sentences},
          )
          assert coach_status == 200 and coach_payload.get('ok') is True
          coach = coach_payload.get('coach') or {}
          recommendations = coach.get('recommendations') or []
          assert 1 <= len(recommendations) <= 3
          assert coach.get('summaryJa') and coach.get('summaryZh')
          assert coach.get('opinionQuestion') and coach.get('worldPromptJa')
          for recommendation in recommendations:
              assert recommendation.get('sentence') in sentences
              assert recommendation.get('expression')
              assert recommendation.get('dailyVersion')
              assert recommendation.get('workVersion')
              assert recommendation.get('chunks')

          print(json.dumps({
              'ok': True,
              'manifestShareTarget': manifest['share_target'],
              'parse': {
                  'title': parsed['title'],
                  'resolvedBy': parsed.get('resolvedBy'),
                  'sentenceCount': len(sentences),
              },
              'coach': {
                  'model': coach_payload.get('model'),
                  'cached': coach_payload.get('cached'),
                  'recommendationCount': len(recommendations),
                  'labels': [item.get('label') for item in recommendations],
                  'summaryJa': coach.get('summaryJa'),
              },
          }, ensure_ascii=False, indent=2))
          PY
