name: Sol Living Scene V2 Review Evidence
on:
  push:
    branches: [nihongo-living-scene-v2-local-20260906]
    paths: ['.github/workflows/sol-living-scene-v2-review-artifact.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify V2 evidence
        run: |
          test -s docs/living-scene/v2/evidence/hero-clean.png
          test -s docs/living-scene/v2/evidence/subtitle.png
          test -s docs/living-scene/v2/evidence/controls-revealed.png
          test -s docs/living-scene/v2/evidence/semantic-mattes.png
          test -s docs/living-scene/v2/evidence/browser-tour.mp4
          sha256sum docs/living-scene/v2/evidence/hero-clean.png docs/living-scene/v2/evidence/browser-tour.mp4 > /tmp/v2-evidence-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: living-scene-v2-sol-review
          path: |
            docs/living-scene/v2/evidence/hero-clean.png
            docs/living-scene/v2/evidence/subtitle.png
            docs/living-scene/v2/evidence/controls-revealed.png
            docs/living-scene/v2/evidence/semantic-mattes.png
            docs/living-scene/v2/evidence/browser-tour.mp4
            docs/living-scene/v2/evidence/verification.json
            /tmp/v2-evidence-sha256.txt
          retention-days: 3
