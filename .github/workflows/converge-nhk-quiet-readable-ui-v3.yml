name: Converge NHK quiet readable UI v3

on:
  push:
    branches: [nihongo-quiet-readable-ui-v1-20260902]
    paths:
      - '.github/workflows/converge-nhk-quiet-readable-ui-v3.yml'

permissions:
  contents: write

concurrency:
  group: converge-nhk-quiet-readable-ui-v3
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-quiet-readable-ui-v1-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh latest feature head and ensure patch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin nihongo-quiet-readable-ui-v1-20260902
          git reset --hard origin/nihongo-quiet-readable-ui-v1-20260902
          if ! grep -q "recordNhkQuietWorldAnswer" src/nhkMorning.ts; then
            python scripts/patch-nhk-quiet-readable-ui-v1.py
          fi
      - name: Verify latest feature head
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "isNhkSessionReadyToComplete(draft, studyMode)" src/NhkMorningPage.tsx
          grep -q "不会伪装成口语分析成绩" src/NhkReviewPage.tsx
          grep -q "安静预习，不计口语成绩" src/NhkMorningPage.tsx
          grep -q "responseMode: 'quiet'" src/nhkMorning.ts
          ! grep -q "speechSynthesis" src/NhkMorningPage.tsx
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Publish latest verified feature head
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/NhkMorningPage.tsx \
            src/nhkMorning.ts \
            src/nhkStudyMode.ts \
            src/NhkStudyModeToggle.tsx \
            src/NhkQuietWorld.tsx \
            src/NhkReviewPage.tsx \
            src/nhkReadable.css \
            src/nhkStudyMode.test.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Add quiet study mode and readable NHK layout"
            git pull --rebase origin nihongo-quiet-readable-ui-v1-20260902
            git push origin HEAD:nihongo-quiet-readable-ui-v1-20260902
          fi
          git fetch origin nihongo-quiet-readable-ui-v1-20260902
          echo "FEATURE_HEAD=$(git rev-parse origin/nihongo-quiet-readable-ui-v1-20260902)" >> "$GITHUB_ENV"
      - name: Safely converge current production
        shell: bash
        run: |
          set -euxo pipefail
          FEATURE_BASE=3be753c10e05e1b2da5a92b85163dd68f09a1093
          TARGETS=(
            src/NhkMorningPage.tsx
            src/nhkMorning.ts
            src/nhkStudyMode.ts
            src/NhkStudyModeToggle.tsx
            src/NhkQuietWorld.tsx
            src/NhkReviewPage.tsx
            src/nhkReadable.css
            src/nhkStudyMode.test.ts
          )
          git fetch origin nihongo-vercel
          PROD_BASE=$(git rev-parse origin/nihongo-vercel)
          git worktree add /tmp/nihongo-production "$PROD_BASE"
          cd /tmp/nihongo-production

          if test -f src/nhkStudyMode.ts \
            && grep -q "isNhkSessionReadyToComplete(draft, studyMode)" src/NhkMorningPage.tsx; then
            echo "Quiet readable UI already present in production."
          else
            if ! git diff --quiet "$FEATURE_BASE" "$PROD_BASE" -- src/NhkMorningPage.tsx src/nhkMorning.ts; then
              echo "Production learning source moved and does not contain the verified feature; refusing overwrite."
              exit 72
            fi
            git checkout "$FEATURE_HEAD" -- "${TARGETS[@]}"
          fi

          git diff --check
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

          if ! git diff --quiet; then
            git config user.name "Sol Supervisor"
            git config user.email "actions@users.noreply.github.com"
            git add "${TARGETS[@]}"
            git diff --cached --check
            git commit -m "Add quiet study mode and simplify NHK layout"
            git fetch origin nihongo-vercel
            test "$(git rev-parse origin/nihongo-vercel)" = "$PROD_BASE"
            git push origin HEAD:nihongo-vercel
          fi
