name: Verify current Nihongo production state

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/verify-nhk-causal-world-v1.yml'

permissions:
  contents: write

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-vercel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify current source implementation
        run: |
          test -f src/NhkWorldEvent.tsx
          test -f src/NhkEvidencePage.tsx
          test -f src/NhkBossPage.tsx
          test -f src/nhkBoss.ts
          grep -q "pickNhkWorldCallbackTarget" src/NhkMorningPage.tsx
          grep -q "completeNhkWorldCallback" src/nhkMorning.ts
          grep -q "buildNhkRecallSchedule" src/nhkMorning.ts
          grep -q "buildNhkBossCandidate" src/nhkBoss.ts
          grep -q "今天的新闻，真的进入了你的世界" src/NhkWorldEvent.tsx
          grep -q "本周真实进步" src/NhkEvidencePage.tsx
          grep -q "WEEKLY BOSS" src/NhkBossPage.tsx
      - name: Inspect deployed production bundle
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request

          base = os.environ['BASE'].rstrip('/')
          markers = [
              '今天的新闻，真的进入了你的世界。',
              '本周真实进步',
              'WEEKLY BOSS',
              '第1天',
              '第3天',
              '第7天',
          ]
          result = {
              'result': 'FETCH_FAILED',
              'sourceCommit': os.environ.get('GITHUB_SHA', ''),
              'productionBase': base,
              'asset': '',
              'attempt': 0,
              'markers': markers,
              'present': [],
              'missing': markers,
              'error': '',
          }

          for attempt in range(1, 7):
              result['attempt'] = attempt
              try:
                  headers = {
                      'User-Agent': 'NihongoProductionSupervisor/2.0',
                      'Cache-Control': 'no-cache',
                  }
                  with urllib.request.urlopen(urllib.request.Request(base + '/', headers=headers), timeout=40) as response:
                      html = response.read().decode('utf-8')
                  match = re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
                  if not match:
                      raise RuntimeError('javascript_asset_not_found')
                  asset_url = urllib.parse.urljoin(base + '/', match.group(1))
                  with urllib.request.urlopen(urllib.request.Request(asset_url, headers=headers), timeout=45) as response:
                      javascript = response.read().decode('utf-8')

                  def present(value):
                      escaped = json.dumps(value, ensure_ascii=True)[1:-1]
                      return value in javascript or escaped.lower() in javascript.lower()

                  found = [value for value in markers if present(value)]
                  missing = [value for value in markers if value not in found]
                  result.update({
                      'result': 'PASS' if not missing else 'BLOCKED_OLD_DEPLOYMENT',
                      'asset': asset_url,
                      'present': found,
                      'missing': missing,
                      'error': '',
                  })
                  if not missing:
                      break
              except Exception as error:
                  result['error'] = f'{type(error).__name__}: {error}'
              if attempt < 6:
                  time.sleep(10)

          os.makedirs('/tmp/nihongo-verification', exist_ok=True)
          with open('/tmp/nihongo-verification/production-state.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Record result and remove one-time workflow
        run: |
          mkdir -p docs/verification
          cp /tmp/nihongo-verification/production-state.json docs/verification/NIHONGO_PRODUCTION_STATE_20260901.json
          rm .github/workflows/verify-nhk-causal-world-v1.yml
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record current Nihongo production state"
          git pull --rebase origin nihongo-vercel
          git push origin HEAD:nihongo-vercel
