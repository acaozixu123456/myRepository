name: NHK mic and topics real API acceptance
on:
  push:
    branches: [nhk-mic-topics-20260909]
    paths: [.github/workflows/nhk-mic-topics-live.yml, scripts/nhk-mic-topics-live.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - name: Real topic batches, signatures, voice and RMS meters
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/mic-live-vite.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          LIVE_PROXY=0 node scripts/nhk-mic-topics-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhk-mic-topics-live
          path: artifacts/mic-topics-live/
