name: NHK coach contract smoke once

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/nhk-coach-contract-smoke-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify normalized production coach labels
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
          ARTICLE: https://www.mojidict.com/article/lzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          base = os.environ['BASE']
          article = os.environ['ARTICLE']

          def get_json(url, attempts=5):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'NihongoCoachContract/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=40) as response:
                          return response.status, json.loads(response.read().decode('utf-8'))
                  except Exception as error:
                      last = repr(error)
                      time.sleep(4 * attempt)
              raise RuntimeError(last)

          def post_json(url, payload, attempts=4):
              last = None
              body = json.dumps(payload, ensure_ascii=False).encode('utf-8')
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      url,
                      data=body,
                      method='POST',
                      headers={'User-Agent':'NihongoCoachContract/1.0','Content-Type':'application/json'},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=70) as response:
                          return response.status, json.loads(response.read().decode('utf-8'))
                  except urllib.error.HTTPError as error:
                      last = {'status': error.code, 'body': error.read().decode('utf-8', errors='replace')}
                  except Exception as error:
                      last = repr(error)
                  time.sleep(5 * attempt)
              raise RuntimeError(last)

          parse_url = base + '/api/moji-article?' + urllib.parse.urlencode({'url': article})
          status, parsed = get_json(parse_url)
          assert status == 200 and parsed.get('ok') is True
          sentences = parsed.get('sentences') or []
          assert len(sentences) >= 5

          status, payload = post_json(base + '/api/nhk-coach', {
              'title': parsed['title'],
              'sentences': sentences,
          })
          assert status == 200 and payload.get('ok') is True
          coach = payload.get('coach') or {}
          recommendations = coach.get('recommendations') or []
          labels = [item.get('label') for item in recommendations]
          assert labels == ['核心', '跟读', '迁移'], labels
          assert len({item.get('sentence') for item in recommendations}) == 3
          assert all(item.get('sentence') in sentences for item in recommendations)
          assert all(item.get('chunks') for item in recommendations)
          assert all(item.get('expression') and item.get('dailyVersion') and item.get('workVersion') for item in recommendations)
          print(json.dumps({
              'ok': True,
              'model': payload.get('model'),
              'cached': payload.get('cached'),
              'labels': labels,
              'sentences': [item.get('sentence') for item in recommendations],
          }, ensure_ascii=False, indent=2))
          PY
