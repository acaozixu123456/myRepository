name: Nihongo Exploration Preparation
on:
  push:
    branches: [nihongo-explore-slice-20260906]
    paths: ['.github/workflows/nihongo-explore-prepare.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nihongo-explore-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install baseline and pinned game engine for isolated development
        run: |
          npm ci --no-audit --no-fund
          npm install --no-audit --no-fund --save-exact @babylonjs/core@9.25.0
      - name: Fetch bounded OpenStreetMap street geometry
        run: |
          mkdir -p explore-preparation
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const query='[out:json][timeout:30];way["highway"](35.7262,139.7643,35.7285,139.7688);out geom;';
          let success=false;
          for(const endpoint of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']) {
            try {
              const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','User-Agent':'NihongoDiscoveryExplorationPrototype/0.1 (bounded non-commercial map extract)'},body:new URLSearchParams({data:query}),signal:AbortSignal.timeout(45000)});
              if(!response.ok) throw Error('HTTP '+response.status);
              const data=await response.json();
              if(!Array.isArray(data.elements)||data.elements.length===0) throw Error('empty map');
              fs.writeFileSync('explore-preparation/yanaka-osm.json',JSON.stringify(data,null,2));
              fs.writeFileSync('explore-preparation/map-source.json',JSON.stringify({query,endpoint,retrievedAt:new Date().toISOString(),attribution:'© OpenStreetMap contributors',license:'ODbL-1.0',licenseUrl:'https://www.openstreetmap.org/copyright',roadCount:data.elements.length},null,2));
              console.log('Roads fetched: '+data.elements.length); success=true; break;
            } catch(error) {console.warn(String(error));}
          }
          if(!success) fs.writeFileSync('explore-preparation/MAP_UNAVAILABLE.txt','Real map retrieval failed. Do not label synthetic geometry as real map data.');
          JS
      - name: Archive source and dependencies without credentials or git history
        run: |
          tar --exclude=.git --exclude=explore-preparation/workspace.tar.gz -czf /tmp/workspace.tar.gz .
          mv /tmp/workspace.tar.gz explore-preparation/workspace.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nihongo-exploration-workspace
          path: explore-preparation/
          retention-days: 7
