name: MOJi parse debug once

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-debug-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare target headline with NHK Easy feed
        env:
          HEADLINE: フランス子どもがSNSを使えないようにする
        run: |
          python - <<'PY'
          import html, json, os, re, urllib.request, xml.etree.ElementTree as ET
          from difflib import SequenceMatcher

          def norm(v):
              v=html.unescape(v or '')
              v=re.sub(r'<[^>]+>','',v)
              return re.sub(r'[\s　「」『』・：:、。！？!?（）()\[\]【】]','',v).lower()

          def bigrams(v): return [v[i:i+2] for i in range(max(0,len(v)-1))]
          def dice(a,b):
              a,b=norm(a),norm(b)
              if not a or not b: return 0.0
              if a==b: return 1.0
              if a in b or b in a: return min(len(a),len(b))/max(len(a),len(b))
              ap,bp=bigrams(a),bigrams(b)
              counts={}
              for p in bp: counts[p]=counts.get(p,0)+1
              overlap=0
              for p in ap:
                  if counts.get(p,0)>0:
                      overlap+=1; counts[p]-=1
              return 2*overlap/max(len(ap)+len(bp),1)

          req=urllib.request.Request('https://nhkeasier.com/feed/?no-furiganas',headers={'User-Agent':'NihongoDiscoveryDebug/1.0'})
          with urllib.request.urlopen(req,timeout=25) as r: xml=r.read()
          root=ET.fromstring(xml)
          target=os.environ['HEADLINE']
          rows=[]
          for item in root.findall('./channel/item'):
              title=item.findtext('title') or ''
              rows.append({
                  'title':title,
                  'dice':round(dice(target,title),4),
                  'seq':round(SequenceMatcher(None,norm(target),norm(title)).ratio(),4),
                  'link':item.findtext('link') or '',
                  'pubDate':item.findtext('pubDate') or ''
              })
          rows.sort(key=lambda x:max(x['dice'],x['seq']),reverse=True)
          print(json.dumps({'target':target,'top':rows[:15]},ensure_ascii=False,indent=2))
          PY
