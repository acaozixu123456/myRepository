name: MOJi parse debug once

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-debug-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect target id context in MOJi Nuxt payload
        env:
          ARTICLE_ID: lzXuLYNjQZ
        run: |
          python - <<'PY'
          import html, json, os, urllib.request
          article_id=os.environ['ARTICLE_ID']
          ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          for host in ['www.mojidict.com','m.mojidict.com']:
              try:
                  req=urllib.request.Request(f'https://{host}/article/{article_id}',headers={'User-Agent':ua,'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read().decode('utf-8',errors='replace')
                  decoded=html.unescape(body).replace('\\u3000','　').replace('\\n',' ')
                  occurrences=[]
                  start=0
                  while True:
                      idx=decoded.find(article_id,start)
                      if idx<0: break
                      occurrences.append(decoded[max(0,idx-1200):idx+1200])
                      start=idx+len(article_id)
                      if len(occurrences)>=6: break
                  print(json.dumps({'host':host,'htmlLength':len(body),'occurrenceCount':decoded.count(article_id),'contexts':occurrences},ensure_ascii=False,indent=2))
              except Exception as e:
                  print(json.dumps({'host':host,'error':repr(e)},ensure_ascii=False))
          PY
