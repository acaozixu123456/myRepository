name: MOJi parse debug once

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-debug-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Benchmark 75-day NHK Easier archive lookup
        env:
          HEADLINE: フランス子どもがSNSを使えないようにする
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, html, json, os, re, time, urllib.error, urllib.request

          target=re.sub(r'[\s　「」『』・：:、。！？!?（）()\[\]【】]','',os.environ['HEADLINE']).lower()
          today=datetime.date(2026,9,1)
          dates=[today-datetime.timedelta(days=i) for i in range(1,76) if (today-datetime.timedelta(days=i)).weekday()<5]
          ua='NihongoDiscoveryArchiveProbe/1.0'

          def norm(v):
              v=html.unescape(re.sub(r'<[^>]+>','',v or ''))
              return re.sub(r'[\s　「」『』・：:、。！？!?（）()\[\]【】]','',v).lower()
          def fetch(d):
              url=f'https://nhkeasier.com/{d.year:04d}/{d.month:02d}/{d.day:02d}/'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':ua})
                  with urllib.request.urlopen(req,timeout=6) as r: body=r.read().decode('utf-8',errors='replace')
                  hits=[]
                  for article in re.findall(r'<article\b[\s\S]*?</article>',body,re.I):
                      h3=re.search(r'<h3\b[^>]*>([\s\S]*?)</h3>',article,re.I)
                      if not h3: continue
                      title=html.unescape(re.sub(r'<[^>]+>','',h3.group(1)))
                      n=norm(title)
                      if n==target or target in n or n in target:
                          hits.append({'date':str(d),'url':url,'title':title,'bytes':len(body)})
                  return {'ok':True,'date':str(d),'bytes':len(body),'hits':hits}
              except urllib.error.HTTPError as e:
                  return {'ok':False,'date':str(d),'status':e.code,'hits':[]}
              except Exception as e:
                  return {'ok':False,'date':str(d),'error':repr(e),'hits':[]}

          started=time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=14) as pool:
              results=list(pool.map(fetch,dates))
          elapsed=time.time()-started
          hits=[h for r in results for h in r['hits']]
          print(json.dumps({
              'elapsedSeconds':round(elapsed,3),'requestedDays':len(dates),
              'okDays':sum(1 for r in results if r['ok']),'totalBytes':sum(r.get('bytes',0) for r in results),
              'hits':hits,'errors':[r for r in results if not r['ok']][:10]
          },ensure_ascii=False,indent=2))
          if not hits: raise SystemExit('target not found')
          PY
