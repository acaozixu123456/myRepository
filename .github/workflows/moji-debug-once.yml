name: MOJi parse debug once

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-debug-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify repeated production parsing is stable
        env:
          URL: https://nihongo-discovery-v2-20260831.vercel.app/api/moji-article?url=https%3A%2F%2Fwww.mojidict.com%2Farticle%2FlzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          results=[]
          for attempt in range(1, 9):
              req=urllib.request.Request(os.environ['URL'], headers={'User-Agent':'NihongoDiscoveryStability/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      payload=json.loads(response.read().decode('utf-8'))
                      row={
                          'attempt':attempt,
                          'status':response.status,
                          'resolvedBy':payload.get('resolvedBy'),
                          'title':payload.get('title'),
                          'sentenceCount':len(payload.get('sentences') or []),
                          'first':(payload.get('sentences') or [''])[0],
                      }
              except urllib.error.HTTPError as error:
                  row={'attempt':attempt,'status':error.code,'body':error.read().decode('utf-8',errors='replace')}
              except Exception as error:
                  row={'attempt':attempt,'error':repr(error)}
              print(json.dumps(row,ensure_ascii=False))
              results.append(row)
              time.sleep(1)

          bad=[]
          for row in results:
              if row.get('status') != 200: bad.append(row); continue
              if row.get('resolvedBy') != 'public-nhk-archive': bad.append(row); continue
              if '法国' not in (row.get('title') or ''): bad.append(row); continue
              if row.get('sentenceCount',0) < 5: bad.append(row); continue
              if '子どものSNSの使い方が' not in (row.get('first') or ''): bad.append(row); continue
          if bad:
              raise SystemExit('unstable production parse: '+json.dumps(bad,ensure_ascii=False))
          print(json.dumps({'ok':True,'attempts':len(results)},ensure_ascii=False))
          PY
