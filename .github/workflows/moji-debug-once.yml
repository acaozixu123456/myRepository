name: MOJi parse debug once

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-debug-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect target article HTML and production parser
        env:
          ARTICLE_ID: lzXuLYNjQZ
          PROD: https://nihongo-discovery-v2-20260831.vercel.app/api/moji-article
        run: |
          python - <<'PY'
          import html, json, os, re, time, urllib.error, urllib.parse, urllib.request

          article_id = os.environ['ARTICLE_ID']
          ua = 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept-Language':'ja,en;q=0.8,zh-CN;q=0.6','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.status, r.geturl(), r.read().decode('utf-8', errors='replace')

          def meta(body, key):
              for tag in re.findall(r'<meta\\b[^>]*>', body, re.I):
                  if re.search(rf'(?:name|property)=["\\\']{re.escape(key)}["\\\']', tag, re.I):
                      m = re.search(r'content=["\\\']([\\s\\S]*?)["\\\']', tag, re.I)
                      if m: return html.unescape(m.group(1))
              return ''

          for host in ['www.mojidict.com','m.mojidict.com']:
              url=f'https://{host}/article/{article_id}'
              try:
                  status, final, body=fetch(url)
                  decoded=html.unescape(body).replace('\\u3000','　').replace('\\n',' ')
                  title=re.search(r'<title[^>]*>([\\s\\S]*?)</title>', body, re.I)
                  target_var=re.search(rf'([A-Za-z_$][\\w$]*)\\.objectId\\s*=\\s*["\\\']{article_id}["\\\']', decoded)
                  var=target_var.group(1) if target_var else ''
                  def prop(name):
                      if not var: return ''
                      m=re.search(rf'{re.escape(var)}\\.{name}\\s*=\\s*["\\\']([\\s\\S]*?)["\\\']\\s*;', decoded, re.I)
                      return m.group(1) if m else ''
                  def boolean(name):
                      if not var: return None
                      m=re.search(rf'{re.escape(var)}\\.{name}\\s*=\\s*(true|false)\\s*;', decoded, re.I)
                      return m.group(1) if m else None
                  japanese_lines=[]
                  visible=re.sub(r'<(script|style|noscript|svg|canvas|template)\\b[^>]*>[\\s\\S]*?</\\1>', ' ', body, flags=re.I)
                  visible=re.sub(r'<[^>]+>', '\\n', visible)
                  visible=html.unescape(visible)
                  for line in visible.splitlines():
                      line=' '.join(line.split())
                      if len(line)>=8 and re.search(r'[ぁ-んァ-ヶー]', line): japanese_lines.append(line[:180])
                  print(json.dumps({
                      'host':host,'status':status,'final':final,'htmlLength':len(body),
                      'titleTag':html.unescape(title.group(1)) if title else '',
                      'ogTitle':meta(body,'og:title'),'description':meta(body,'description'),'ogDescription':meta(body,'og:description'),
                      'targetVar':var,'targetTitle':prop('title'),'targetNotationTitle':prop('notationTitle'),'targetExcerpt':prop('excerpt'),'targetVip':boolean('isVIP'),
                      'memberText':bool(re.search(r'会员专享文章|请打开\\s*App\\s*阅读', decoded, re.I)),
                      'visibleJapanese':japanese_lines[:12]
                  },ensure_ascii=False,indent=2))
              except Exception as e:
                  print(json.dumps({'host':host,'error':repr(e)},ensure_ascii=False))

          endpoint=os.environ['PROD']+'?'+urllib.parse.urlencode({'url':f'https://www.mojidict.com/article/{article_id}'})
          for i in range(1,7):
              try:
                  req=urllib.request.Request(endpoint,headers={'User-Agent':'NihongoDiscoveryDebug/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      payload=json.loads(r.read().decode('utf-8'))
                      print(json.dumps({'prodAttempt':i,'status':r.status,'payload':payload},ensure_ascii=False,indent=2))
              except urllib.error.HTTPError as e:
                  print(json.dumps({'prodAttempt':i,'status':e.code,'body':e.read().decode('utf-8',errors='replace')},ensure_ascii=False,indent=2))
              except Exception as e:
                  print(json.dumps({'prodAttempt':i,'error':repr(e)},ensure_ascii=False))
              time.sleep(2)
          PY
