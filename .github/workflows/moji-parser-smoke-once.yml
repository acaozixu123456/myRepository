name: MOJi parser production smoke

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-parser-smoke-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect safe MOJi metadata and embedded article hints
        env:
          ARTICLE_ID: Izr0dhrpz3
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          article_id = os.environ['ARTICLE_ID']
          targets = [
              ('desktop', f'https://www.mojidict.com/article/{article_id}'),
              ('mobile', f'https://m.mojidict.com/article/{article_id}'),
          ]
          uas = [
              ('browser', 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'),
              ('study', 'NihongoDiscovery/0.2 (+private language study)'),
          ]

          def meta_value(text, key):
              patterns = [
                  rf'<meta[^>]+(?:property|name)=["\']{re.escape(key)}["\'][^>]+content=["\']([^"\']*)',
                  rf'<meta[^>]+content=["\']([^"\']*)["\'][^>]+(?:property|name)=["\']{re.escape(key)}["\']',
              ]
              for pattern in patterns:
                  match = re.search(pattern, text, re.I)
                  if match:
                      return html.unescape(match.group(1))[:500]
              return ''

          for target_name, url in targets:
              for ua_name, ua in uas:
                  try:
                      request = urllib.request.Request(url, headers={
                          'User-Agent': ua,
                          'Accept-Language': 'ja,en;q=0.8,zh-CN;q=0.6',
                          'Accept': 'text/html,application/xhtml+xml',
                      })
                      with urllib.request.urlopen(request, timeout=25) as response:
                          raw = response.read(2_500_000)
                          text = raw.decode('utf-8', errors='replace')
                          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I)
                          japanese_runs = []
                          for run in re.findall(r'[\u3000-\u30ff\u3400-\u9fffA-Za-z0-9０-９「」『』・、。！？!?\s]{12,220}', html.unescape(text)):
                              clean = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', run)).strip()
                              if re.search(r'[ぁ-んァ-ヶー]', clean) and clean not in japanese_runs:
                                  japanese_runs.append(clean[:220])
                              if len(japanese_runs) >= 20:
                                  break
                          markers = {}
                          for marker in ['島根', '中学生', '保育園', '大田市', article_id, '__NEXT_DATA__', '__NUXT__', '会员专享']:
                              markers[marker] = marker in text
                          print(json.dumps({
                              'target': target_name,
                              'ua': ua_name,
                              'status': response.status,
                              'finalUrl': response.url,
                              'bytes': len(raw),
                              'title': meta_value(text, 'og:title') or meta_value(text, 'twitter:title'),
                              'description': meta_value(text, 'og:description') or meta_value(text, 'description'),
                              'markers': markers,
                              'scriptCount': len(scripts),
                              'scriptTail': scripts[-8:],
                              'japaneseRuns': japanese_runs,
                          }, ensure_ascii=False, indent=2))
                  except urllib.error.HTTPError as error:
                      print(json.dumps({'target': target_name, 'ua': ua_name, 'status': error.code, 'error': str(error)}, ensure_ascii=False))
                  except Exception as error:
                      print(json.dumps({'target': target_name, 'ua': ua_name, 'error': repr(error)}, ensure_ascii=False))
          PY
