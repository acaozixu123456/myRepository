name: MOJi parser production smoke

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-parser-smoke-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify one pasted MOJi link becomes selectable sentences
        env:
          ENDPOINT: https://nihongo-discovery-v2-20260831.vercel.app/api/moji-article
          ARTICLE_URL: https://www.mojidict.com/article/Izr0dhrpz3
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = os.environ['ENDPOINT'] + '?' + urllib.parse.urlencode({'url': os.environ['ARTICLE_URL']})
          last = None
          for attempt in range(1, 16):
              try:
                  request = urllib.request.Request(endpoint, headers={'User-Agent': 'NihongoDiscoverySmoke/0.3'})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  last = payload
                  sentences = payload.get('sentences') or []
                  if (
                      payload.get('ok') is True
                      and payload.get('access') == 'matched-public'
                      and payload.get('resolvedBy') == 'public-nhk-match'
                      and len(sentences) >= 3
                      and any('仕事を体験しました' in sentence for sentence in sentences)
                  ):
                      print(json.dumps({
                          'attempt': attempt,
                          'title': payload.get('title'),
                          'headlineHint': payload.get('headlineHint'),
                          'access': payload.get('access'),
                          'sentenceCount': len(sentences),
                          'firstThree': sentences[:3],
                          'referenceUrl': payload.get('referenceUrl'),
                      }, ensure_ascii=False, indent=2))
                      raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  last = {
                      'status': error.code,
                      'body': error.read().decode('utf-8', errors='replace'),
                  }
              except Exception as error:
                  last = {'error': repr(error)}
              if attempt < 15:
                  time.sleep(8)
          raise SystemExit('link-only production verification failed: ' + json.dumps(last, ensure_ascii=False))
          PY
