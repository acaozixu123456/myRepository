name: MOJi parser production smoke

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-parser-smoke-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the real shared MOJi article
        env:
          ENDPOINT: https://nihongo-discovery-v2-20260831.vercel.app/api/moji-article?url=https%3A%2F%2Fwww.mojidict.com%2Farticle%2FIzr0dhrpz3
        run: |
          for attempt in $(seq 1 18); do
            response="$(curl --max-time 20 -sS -w '\n%{http_code}' "$ENDPOINT" || true)"
            status="$(printf '%s' "$response" | tail -n 1)"
            body="$(printf '%s' "$response" | sed '$d')"
            if BODY="$body" node -e 'const p=JSON.parse(process.env.BODY||"{}"); if(!p.ok||!p.title||!Array.isArray(p.sentences)||p.sentences.length<1) process.exit(1); console.log(JSON.stringify({ok:true,title:p.title,sentenceCount:p.sentences.length,candidates:p.sentences.slice(0,3).map((s,i)=>({index:i+1,length:s.length,preview:s.slice(0,140)}))}));'; then
              exit 0
            fi
            BODY="$body" STATUS="$status" node -e 'try { const p=JSON.parse(process.env.BODY||"{}"); console.log(JSON.stringify({httpStatus:process.env.STATUS,ok:Boolean(p.ok),reason:p.reason||"unknown",title:p.title||"",sentenceCount:Array.isArray(p.sentences)?p.sentences.length:0})); } catch { console.log(JSON.stringify({httpStatus:process.env.STATUS,ok:false,reason:"non_json_response"})); }'
            sleep 5
          done
          exit 1
