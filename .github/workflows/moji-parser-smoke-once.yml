name: MOJi parser production smoke

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-parser-smoke-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Match the sample MOJi headline against the recent NHK Easy feed
        env:
          HEADLINE: 島根県 中学生が保育園の先生の仕事を体験
        run: |
          python - <<'PY'
          import html
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          request = urllib.request.Request(
              'https://nhkeasier.com/feed/?no-furiganas',
              headers={'User-Agent': 'NihongoDiscovery/0.1 (+private language study)'}
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              body = response.read()
          root = ET.fromstring(body)

          def norm(value):
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', '', value)
              return re.sub(r'[\s　「」『』・：:、。！？!?（）()]', '', value)

          target = norm(os.environ['HEADLINE'])
          matches = []
          for item in root.findall('./channel/item'):
              title = item.findtext('title') or ''
              if norm(title) == target or target in norm(title) or norm(title) in target:
                  description = html.unescape(item.findtext('description') or '')
                  plain = re.sub(r'<[^>]+>', '\n', description)
                  lines = [re.sub(r'\s+', ' ', line).strip() for line in plain.splitlines()]
                  japanese = [line for line in lines if re.search(r'[ぁ-んァ-ヶー]', line)]
                  matches.append({
                      'title': title,
                      'link': item.findtext('link'),
                      'japanese_lines': japanese[:12],
                  })
          print({'feed_bytes': len(body), 'match_count': len(matches), 'matches': matches})
          if not matches or len(matches[0]['japanese_lines']) < 3:
              raise SystemExit('expected matching story with at least three Japanese lines')
          PY
