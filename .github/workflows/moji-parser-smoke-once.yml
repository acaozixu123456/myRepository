name: MOJi parser production smoke

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/moji-parser-smoke-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser probe
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Inspect public article delivery
        env:
          ARTICLE_URL: https://www.mojidict.com/article/Izr0dhrpz3
        run: |
          cat > inspect-moji.cjs <<'NODE'
          const {chromium} = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({
              locale: 'ja-JP',
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1',
              viewport: {width: 390, height: 844},
            });
            const responses = [];
            page.on('response', response => {
              const request = response.request();
              const type = request.resourceType();
              if (!['document', 'xhr', 'fetch', 'image', 'media'].includes(type)) return;
              responses.push({
                type,
                status: response.status(),
                url: response.url(),
                contentType: response.headers()['content-type'] || '',
              });
            });
            await page.goto(process.env.ARTICLE_URL, {waitUntil: 'networkidle', timeout: 60000});
            await page.waitForTimeout(5000);
            const snapshot = await page.evaluate(() => {
              const globals = {};
              for (const key of ['__NEXT_DATA__', '__NUXT__', '__INITIAL_STATE__', '__APOLLO_STATE__']) {
                const value = window[key];
                if (value !== undefined) globals[key] = JSON.stringify(value).slice(0, 5000);
              }
              return {
                url: location.href,
                title: document.title,
                bodyText: document.body?.innerText || '',
                htmlLength: document.documentElement.outerHTML.length,
                meta: [...document.querySelectorAll('meta')].map(node => ({
                  name: node.getAttribute('name'),
                  property: node.getAttribute('property'),
                  content: node.getAttribute('content'),
                })).filter(item => item.content),
                images: [...document.images].map(image => ({
                  src: image.currentSrc || image.src,
                  alt: image.alt,
                  width: image.naturalWidth,
                  height: image.naturalHeight,
                })),
                links: [...document.querySelectorAll('a[href]')].map(node => ({
                  text: (node.textContent || '').trim().slice(0, 120),
                  href: node.href,
                })).filter(item => item.text || item.href.includes('moji')).slice(0, 80),
                inlineScripts: [...document.querySelectorAll('script:not([src])')]
                  .map(node => (node.textContent || '').trim())
                  .filter(Boolean)
                  .map(text => ({length: text.length, preview: text.slice(0, 1500)})),
                globals,
              };
            });
            await page.screenshot({path: 'moji-page.png', fullPage: true});
            const largest = [...snapshot.images].sort((a, b) => b.width * b.height - a.width * a.height)[0];
            let largestImage = null;
            if (largest?.src) {
              const response = await page.request.get(largest.src);
              if (response.ok()) {
                const body = await response.body();
                fs.writeFileSync('moji-largest-image.bin', body);
                largestImage = {...largest, bytes: body.length};
              }
            }
            console.log(JSON.stringify({snapshot, responses, largestImage}, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exit(1);
          });
          NODE
          node inspect-moji.cjs
          file moji-page.png moji-largest-image.bin || true
          ls -lh moji-page.png moji-largest-image.bin || true
