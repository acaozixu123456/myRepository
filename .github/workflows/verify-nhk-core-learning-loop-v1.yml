name: Verify NHK core learning loop v1

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/verify-nhk-core-learning-loop-v1.yml'

permissions:
  contents: write

jobs:
  verify-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-vercel
          fetch-depth: 0

      - name: Require the complete production evidence chain
        run: |
          python - <<'PY'
          import json, time, urllib.request
          files = [
              'NHK_CAUSAL_WORLD_V1.json',
              'NHK_WEEKLY_EVIDENCE_V1.json',
              'NHK_UNSEEN_RECALL_V1.json',
              'NHK_CAUSAL_EPISODE_BRIDGE_V1.json',
              'NHK_WEEKLY_BOSS_V1.json',
          ]
          base = 'https://raw.githubusercontent.com/acaozixu123456/myRepository/nihongo-vercel/docs/verification/'
          evidence = {}
          for attempt in range(1, 81):
              try:
                  for name in files:
                      request = urllib.request.Request(base + name, headers={'User-Agent':'NihongoCoreLoopVerifier/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                      if payload.get('result') != 'PASS':
                          raise RuntimeError(f'{name} is not PASS')
                      evidence[name] = payload
                  break
              except Exception:
                  if attempt == 80:
                      raise
                  time.sleep(10)
          with open('/tmp/core-evidence-chain.json','w',encoding='utf-8') as handle:
              json.dump(evidence, handle, ensure_ascii=False, indent=2)
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Refresh to the latest promoted production commit
        run: |
          git fetch origin nihongo-vercel
          git reset --hard origin/nihongo-vercel

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify complete source contract
        run: |
          test -f src/nhkLearningEvidence.ts
          test -f src/NhkWeeklyEvidence.tsx
          test -f src/nhkRecallScenario.ts
          test -f src/nhkWorldEpisodeBridge.ts
          test -f src/nhkWeeklyBoss.ts
          test -f src/NhkWeeklyBoss.tsx
          grep -q "nihongo-nhk-morning-v2" src/nhkMorning.ts
          grep -q "NHK_SPEECH_COACH_VERSION" src/NhkSpeechCoach.tsx
          grep -q "NHK_CAUSAL_WORLD_VERSION" src/nhkCausalWorld.ts
          grep -q "NHK_WEEKLY_EVIDENCE_VERSION" src/nhkLearningEvidence.ts
          grep -q "NHK_UNSEEN_RECALL_VERSION" src/nhkRecallScenario.ts
          grep -q "NHK_WORLD_EPISODE_BRIDGE_VERSION" src/nhkWorldEpisodeBridge.ts
          grep -q "NHK_WEEKLY_BOSS_VERSION" src/nhkWeeklyBoss.ts

      - name: Verify deployed production contract
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
        run: |
          python - <<'PY'
          import json, os, re, subprocess, time, urllib.parse, urllib.request
          base = os.environ['BASE'].rstrip('/')
          markers = [
              'nihongo-nhk-morning-v2',
              'nhk-speech-coach-v1',
              'nhk-causal-world-v1',
              'nhk-weekly-evidence-v1',
              'nhk-unseen-recall-v1',
              'nhk-world-episode-bridge-v1',
              'nhk-weekly-boss-v1',
              '以前的你 vs 现在的你',
              '新场景主动迁移',
              '今天的回答改变了这一集的开场',
              'WEEKLY BOSS · 3 MIN',
          ]
          result = None
          for attempt in range(1, 31):
              try:
                  started = time.monotonic()
                  request = urllib.request.Request(base + '/', headers={'User-Agent':'NihongoCoreLoopFinal/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request, timeout=40) as response:
                      html = response.read().decode('utf-8')
                  root_ms = round((time.monotonic() - started) * 1000)
                  match = re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
                  if not match:
                      raise RuntimeError('asset_not_found')
                  asset_url = urllib.parse.urljoin(base + '/', match.group(1))
                  started = time.monotonic()
                  with urllib.request.urlopen(urllib.request.Request(asset_url, headers={'User-Agent':'NihongoCoreLoopFinal/1.0','Cache-Control':'no-cache'}), timeout=45) as response:
                      javascript = response.read().decode('utf-8')
                  asset_ms = round((time.monotonic() - started) * 1000)
                  missing = [value for value in markers if value not in javascript and json.dumps(value, ensure_ascii=True)[1:-1].lower() not in javascript.lower()]
                  if missing:
                      raise RuntimeError('missing:' + ','.join(missing))
                  evidence = json.load(open('/tmp/core-evidence-chain.json', encoding='utf-8'))
                  result = {
                      'result': 'PASS',
                      'productionCommit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                      'verifiedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                      'rootMs': root_ms,
                      'assetMs': asset_ms,
                      'asset': asset_url,
                      'markers': markers,
                      'evidenceFiles': list(evidence),
                      'contract': [
                          'one real link to aligned DailyInputV2',
                          'speech-first primary-sentence TTS, recording, transcription, and concrete feedback',
                          'unscripted recap and world revisions',
                          'causal event, day-3 callback, and one-shot canonical-episode bridge',
                          'D1 same-structure, D3 unseen daily, and D7 unseen business recall',
                          'weekly before-versus-now evidence without acoustic-score claims',
                          'five-expression no-choice adaptive speech-first weekly Boss',
                      ],
                      'actualLearnerImprovementClaimed': False,
                  }
                  break
              except Exception:
                  if attempt == 30:
                      raise
                  time.sleep(min(5 + attempt, 15))
          with open('/tmp/core-loop-verification.json','w',encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Record final milestone and remove one-time workflow
        run: |
          mkdir -p docs/verification
          cp /tmp/core-loop-verification.json docs/verification/NHK_CORE_LEARNING_LOOP_V1.json
          rm .github/workflows/verify-nhk-core-learning-loop-v1.yml
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record verified NHK core learning loop v1"
          git push origin HEAD:nihongo-vercel
