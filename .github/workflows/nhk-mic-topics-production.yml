name: NHK mic and generated topics production phone gate
on:
  push:
    branches: [nihongo-vercel]
    paths: [.github/workflows/nhk-mic-topics-production.yml, scripts/nhk-mic-topics-production.mjs, src/nhkAudioActivity.ts, src/nhkTopicDeck.ts, src/NhkVoiceControls.tsx, src/nhkVoiceControls.css, src/nhkChatConnection.ts, server/nhkSpeakingProxy.ts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - run: node scripts/nhk-mic-topics-production.mjs
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - name: Phone-only controls and actual production API synthetic audio
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/mic-prod-vite.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          node scripts/nhk-mic-topics-browser.mjs
          LIVE_PROXY=1 node scripts/nhk-mic-topics-live.mjs
          node scripts/nhk-mic-topics-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhk-mic-topics-production
          path: |
            artifacts/mic-topics/
            artifacts/mic-topics-live/
            artifacts/mic-topics-production/
            artifacts/teacher-production/
            artifacts/turn-support-production/
