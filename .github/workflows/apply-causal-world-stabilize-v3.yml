name: Apply causal world stabilization v3

on:
  push:
    branches: [nihongo-causal-world-stabilize-v3-20260901]
    paths:
      - '.github/workflows/apply-causal-world-stabilize-v3.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-causal-world-stabilize-v3-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Replay verified stabilization diff
        run: |
          git show --format= a2fb071ada0a8dfaf41109728707f317762ff986 -- src/NhkWorldEvent.tsx src/nhkMorning.ts src/nhkMorning.test.ts > /tmp/causal-stabilize.patch
          git apply --3way /tmp/causal-stabilize.patch
          if ! grep -q '.nhk-causal-metrics' src/nhkMorning.css; then
            cat >> src/nhkMorning.css <<'CSS'
          .nhk-causal-metrics{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.nhk-causal-metrics span{border-radius:999px;background:#eef4dc;color:#52683a;padding:6px 9px;font-size:8px;font-weight:800}.nhk-causal-metrics b{font-size:11px;margin-left:3px}
          CSS
          fi
          grep -q 'eventId: `${sourceKey}-${session.dateKey}-world-event`' src/nhkMorning.ts
          grep -q 'targetExpressionUsed' src/NhkWorldEvent.tsx
          grep -q 'recordingSecondsRef' src/NhkWorldEvent.tsx
          grep -q 'recallTask' src/nhkMorning.ts
          grep -q 'NhkEvidencePage' src/NhkMorningPage.tsx
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified replay and remove one-time workflow
        run: |
          rm .github/workflows/apply-causal-world-stabilize-v3.yml
          git config user.name 'Sol Supervisor'
          git config user.email 'actions@users.noreply.github.com'
          git add src/NhkWorldEvent.tsx src/nhkMorning.ts src/nhkMorning.test.ts src/nhkMorning.css .github/workflows/apply-causal-world-stabilize-v3.yml
          git commit -m 'Stabilize causal world on distinct recall tasks'
          git push origin HEAD:nihongo-causal-world-stabilize-v3-20260901
