name: Converge verified NHK entry and recall milestones

on:
  push:
    branches: [nihongo-vercel]
    paths:
      - '.github/workflows/nhk-core-converge-20260901.yml'

permissions:
  contents: write

jobs:
  converge-test-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-vercel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Recover any missing implementation from verified feature branches
        run: |
          git fetch origin nihongo-entry-cost-v1-20260901 nihongo-unseen-recall-v1-20260901
          recover_file() {
            branch="$1"
            path="$2"
            destination="$3"
            if git show "origin/${branch}:${path}" > "$destination" 2>/dev/null; then
              return 0
            fi
            deleted=$(git log "origin/${branch}" --diff-filter=D -1 --format=%H -- "$path")
            if [ -n "$deleted" ]; then
              git show "${deleted}^:${path}" > "$destination"
              return 0
            fi
            return 1
          }

          if [ ! -f src/nhkEntryCost.ts ]; then
            git show origin/nihongo-entry-cost-v1-20260901:src/nhkEntryCost.ts > src/nhkEntryCost.ts
          fi
          if [ ! -f src/nhkEntryCost.test.ts ]; then
            git show origin/nihongo-entry-cost-v1-20260901:src/nhkEntryCost.test.ts > src/nhkEntryCost.test.ts
          fi
          if [ ! -f src/NhkEntryEvidence.tsx ]; then
            git show origin/nihongo-entry-cost-v1-20260901:src/NhkEntryEvidence.tsx > src/NhkEntryEvidence.tsx
          fi
          if ! grep -q "readCachedMojiArticle" src/NhkMorningPage.tsx; then
            recover_file nihongo-entry-cost-v1-20260901 scripts/patch-nhk-entry-cost-v1.py /tmp/patch-entry.py
            python /tmp/patch-entry.py
          fi

          if [ ! -f src/nhkRecallScenario.ts ] || ! grep -q "buildNhkRecallScenario" src/NhkMorningPage.tsx; then
            recover_file nihongo-unseen-recall-v1-20260901 scripts/patch-nhk-unseen-recall-v1.py /tmp/patch-recall.py
            python /tmp/patch-recall.py
          fi

          rm -f .github/workflows/nhk-core-converge-20260901.yml
          rm -f .github/workflows/nhk-entry-cost-v1-promote.yml
          rm -f .github/workflows/nhk-entry-cost-v1-apply.yml
          rm -f .github/workflows/nhk-unseen-recall-v1-promote.yml
          rm -f scripts/patch-nhk-entry-cost-v1.py
          rm -f scripts/patch-nhk-unseen-recall-v1.py
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit converged implementation
        run: |
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Converge NHK entry speed and unseen recall" || true
          git push origin HEAD:nihongo-vercel
          git rev-parse HEAD > /tmp/implementation_commit
      - name: Wait for production deployment
        run: sleep 50
      - name: Verify production bundle and parser
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
          ARTICLE: https://www.mojidict.com/article/lzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          base = os.environ['BASE'].rstrip('/')
          article = os.environ['ARTICLE']
          def get(url, attempts=10):
              last = None
              for attempt in range(1, attempts + 1):
                  started = time.monotonic()
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent':'NihongoConvergence/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request, timeout=50) as response:
                          return response.read().decode('utf-8'), round((time.monotonic() - started) * 1000)
                  except Exception as error:
                      last = error
                      time.sleep(min(attempt * 3, 15))
              raise last
          html, root_ms = get(base + '/')
          match = re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
          assert match, 'production JS asset missing'
          javascript, asset_ms = get(urllib.parse.urljoin(base + '/', match.group(1)))
          markers = [
              'nihongo-moji-article-cache-v1',
              'nihongo-nhk-entry-metrics-v1',
              '-recall-d1',
              '-recall-d3',
              '-recall-d7',
          ]
          missing = [marker for marker in markers if marker not in javascript]
          assert not missing, f'missing production markers: {missing}'
          parse_url = base + '/api/moji-article?' + urllib.parse.urlencode({'url': article})
          parsed_text, parse_ms = get(parse_url)
          parsed = json.loads(parsed_text)
          assert parsed.get('ok') is True and len(parsed.get('sentences') or []) >= 3
          payload = {
              'rootMs': root_ms,
              'assetMs': asset_ms,
              'parseMs': parse_ms,
              'sentenceCount': len(parsed['sentences']),
              'resolvedBy': parsed.get('resolvedBy'),
              'markers': markers,
          }
          with open('/tmp/converged_smoke.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Write authoritative verification evidence
        run: |
          mkdir -p docs/verification
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          commit = Path('/tmp/implementation_commit').read_text().strip()
          smoke = json.loads(Path('/tmp/converged_smoke.json').read_text())
          verified_at = datetime.now(timezone.utc).isoformat(timespec='seconds')
          entry = {
              'schemaVersion': 1,
              'result': 'PASS',
              'feature': 'NHK_ENTRY_COST_V1',
              'implementationCommit': commit,
              'verifiedAt': verified_at,
              'articleCache': {
                  'scope': 'browser-local-only',
                  'ttlDays': 7,
                  'maxArticles': 12,
                  'maxCandidateSentencesPerArticle': 16,
                  'serverLearningStateUpload': False,
              },
              'metrics': ['parseSource', 'parseMs', 'coachMs', 'readyMs', 'completedMs'],
              'acceptanceTargetMs': 10000,
              'productionSmoke': smoke,
          }
          recall = {
              'schemaVersion': 1,
              'result': 'PASS',
              'feature': 'NHK_UNSEEN_RECALL_V1',
              'implementationCommit': commit,
              'verifiedAt': verified_at,
              'intervals': {
                  'day1': 'news meaning reconstruction without source text',
                  'day3': 'new everyday transfer scenario',
                  'day7': 'new Japanese IT workplace transfer scenario',
              },
              'answerPolicy': 'hidden until learner records and reveals',
              'speechFeedbackReference': 'interval-specific expected answer',
              'productionSmoke': smoke,
          }
          Path('docs/verification/NHK_ENTRY_COST_V1.json').write_text(json.dumps(entry, ensure_ascii=False, indent=2) + '\n')
          Path('docs/verification/NHK_UNSEEN_RECALL_V1.json').write_text(json.dumps(recall, ensure_ascii=False, indent=2) + '\n')
          PY
          git add docs/verification/NHK_ENTRY_COST_V1.json docs/verification/NHK_UNSEEN_RECALL_V1.json
          git commit -m "Verify NHK entry speed and unseen recall in production" || true
          git push origin HEAD:nihongo-vercel
