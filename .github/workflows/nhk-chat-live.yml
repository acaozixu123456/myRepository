name: NHK random chat real mobile voice probe
on:
  push:
    branches: [nhk-chat-random-20260908]
    paths: ['scripts/nhk-chat-live.mjs','.github/workflows/nhk-chat-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Real synthetic-audio multi-turn and lease renewal
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/chat-live.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          node --check scripts/nhk-chat-live.mjs
          node scripts/nhk-chat-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhk-chat-real-voice
          path: artifacts/chat-live/
          if-no-files-found: ignore
