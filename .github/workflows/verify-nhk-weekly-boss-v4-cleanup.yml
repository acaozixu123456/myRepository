name: Finalize clean NHK weekly Boss branch

on:
  push:
    branches:
      - nihongo-weekly-boss-v1-20260901
    paths:
      - '.github/workflows/verify-nhk-weekly-boss-v4-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-weekly-boss-v1-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run build
      - name: Remove temporary implementation artifacts
        shell: bash
        run: |
          rm -f \
            .github/workflows/verify-nhk-weekly-boss-v1.yml \
            .github/workflows/verify-nhk-weekly-boss-v2.yml \
            .github/workflows/verify-nhk-weekly-boss-v3.yml \
            .github/workflows/verify-nhk-weekly-boss-v4-cleanup.yml \
            scripts/patch-nhk-weekly-boss-v1.py \
            scripts/apply-nhk-weekly-boss-v2.mjs \
            scripts/finalize-nhk-weekly-boss-v3.py \
            src/NhkBossPage.tsx \
            src/nhkWeeklyBoss.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Branch already clean.'
            exit 0
          fi
          git commit -m 'Clean temporary weekly Boss implementation artifacts'
          git push origin HEAD:nihongo-weekly-boss-v1-20260901
