name: Native voice and silent text-teacher acceptance
on:
  push:
    branches: [nihongo-adaptive-companion-v3-20260909]
    paths: ['scripts/companion-written-live.mjs','.github/workflows/companion-written.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  written:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - name: Real native conversation, contextual notes and failure isolation
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/quiet-live.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          node --check scripts/companion-written-live.mjs && node scripts/companion-written-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-silent-teacher-live
          path: |
            artifacts/companion-written/
            artifacts/companion-live/
