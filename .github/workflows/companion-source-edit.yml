name: Verify completed quiet-teacher integration (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/integrate-companion.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
