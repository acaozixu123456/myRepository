name: Promote NHK entry cost v1

on:
  push:
    branches: [nihongo-entry-cost-v1-20260901]
    paths:
      - '.github/workflows/nhk-entry-cost-v1-promote.yml'

permissions:
  contents: write

jobs:
  verify-promote-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nihongo-entry-cost-v1-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebase on current production and finish integration if needed
        run: |
          git fetch origin nihongo-vercel nihongo-entry-cost-v1-20260901
          git rebase origin/nihongo-vercel
          if [ -f scripts/patch-nhk-entry-cost-v1.py ]; then
            python scripts/patch-nhk-entry-cost-v1.py
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit clean implementation
        run: |
          rm -f scripts/patch-nhk-entry-cost-v1.py
          rm -f .github/workflows/nhk-entry-cost-v1-apply.yml
          rm -f .github/workflows/nhk-entry-cost-v1-promote.yml
          git config user.name "Sol Supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Measure and cache NHK training entry" || true
          git push --force-with-lease origin HEAD:nihongo-entry-cost-v1-20260901
      - name: Fast-forward production
        run: |
          git fetch origin nihongo-vercel
          git merge-base --is-ancestor origin/nihongo-vercel HEAD
          git push origin HEAD:nihongo-vercel
          git rev-parse HEAD > /tmp/implementation_commit
      - name: Wait for Vercel promotion
        run: sleep 45
      - name: Verify production bundle and parser
        env:
          BASE: https://nihongo-discovery-v2-20260831.vercel.app
          ARTICLE: https://www.mojidict.com/article/lzXuLYNjQZ
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          base = os.environ['BASE'].rstrip('/')
          article = os.environ['ARTICLE']

          def text(url, attempts=8):
              last = None
              for attempt in range(1, attempts + 1):
                  started = time.monotonic()
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'NihongoEntryCost/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return response.read().decode('utf-8'), round((time.monotonic() - started) * 1000)
                  except Exception as error:
                      last = error
                      time.sleep(min(attempt * 3, 15))
              raise last

          html, root_ms = text(base + '/')
          match = re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
          assert match, 'production asset missing'
          asset_url = urllib.parse.urljoin(base + '/', match.group(1))
          javascript, asset_ms = text(asset_url)
          assert 'nihongo-moji-article-cache-v1' in javascript, 'article cache marker missing'
          assert 'nihongo-nhk-entry-metrics-v1' in javascript, 'entry metric marker missing'
          parse_url = base + '/api/moji-article?' + urllib.parse.urlencode({'url': article})
          parsed_text, parse_ms = text(parse_url)
          parsed = json.loads(parsed_text)
          assert parsed.get('ok') is True and len(parsed.get('sentences') or []) >= 3
          result = {
              'rootMs': root_ms,
              'assetMs': asset_ms,
              'parseMs': parse_ms,
              'sentenceCount': len(parsed['sentences']),
              'resolvedBy': parsed.get('resolvedBy'),
          }
          with open('/tmp/production_smoke.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Record verified production evidence
        run: |
          implementation=$(cat /tmp/implementation_commit)
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p docs/verification
          python - <<'PY'
          import json, os
          from pathlib import Path
          smoke = json.loads(Path('/tmp/production_smoke.json').read_text(encoding='utf-8'))
          payload = {
              'schemaVersion': 1,
              'result': 'PASS',
              'feature': 'NHK_ENTRY_COST_V1',
              'implementationCommit': Path('/tmp/implementation_commit').read_text().strip(),
              'verifiedAt': os.popen('date -u +%Y-%m-%dT%H:%M:%SZ').read().strip(),
              'articleCache': {
                  'scope': 'browser-local-only',
                  'ttlDays': 7,
                  'maxArticles': 12,
                  'maxCandidateSentencesPerArticle': 16,
                  'serverLearningStateUpload': False,
              },
              'metrics': ['parseSource', 'parseMs', 'coachMs', 'readyMs', 'completedMs'],
              'acceptanceTargetMs': 10000,
              'productionSmoke': smoke,
          }
          Path('docs/verification/NHK_ENTRY_COST_V1.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/verification/NHK_ENTRY_COST_V1.json
          git commit -m "Verify NHK entry cost v1 in production"
          git push origin HEAD:nihongo-entry-cost-v1-20260901
          git push origin HEAD:nihongo-vercel
