name: NHK Calm UI Verification
on:
  push:
    branches: [nihongo-calm-ui-20260905]
    paths: ['.github/workflows/nhk-calm-ui-verify.yml', 'scripts/calm-ui-trigger.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nhk-calm-ui-verification
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  verify:
    if: github.ref == 'refs/heads/nihongo-calm-ui-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed release corrections
        run: |
          mkdir -p /tmp/nhk-artifacts
          python3 - <<'PY'
          import pathlib
          css=pathlib.Path('src/nhkCalm.css')
          css.write_text(css.read_text().replace('--muted: #607166;', '--muted: #4f6055;'))
          script=pathlib.Path('scripts/nhk-calm-browser.mjs')
          text=script.read_text()
          if 'const browsers = [];' not in text:
              text=text.replace("const output = '/tmp/nhk-artifacts';", "const browsers = [];\nconst output = '/tmp/nhk-artifacts';")
              text=text.replace("const browser = await ({chromium,webkit})[config.engine].launch();", "const browser = await ({chromium,webkit})[config.engine].launch(); browsers.push(browser);")
              text=text.replace('console.error(error);process.exit(1);', 'console.error(error);process.exitCode=1;')
              text=text.replace("finally {writeFileSync", "finally {await Promise.allSettled(browsers.map(browser => browser.close())); writeFileSync")
              text=text.replace("  const width = await page.evaluate", "  await page.screenshot({path:`${output}/${name}.png`, fullPage:true});\n  const width = await page.evaluate")
          script.write_text(text)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee /tmp/nhk-artifacts/typecheck.txt
      - name: Unit tests
        run: npm test 2>&1 | tee /tmp/nhk-artifacts/unit-tests.txt
      - name: Production build
        run: npm run build 2>&1 | tee /tmp/nhk-artifacts/build.txt
      - name: Browser regressions on Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
          npm run dev -- --host 127.0.0.1 > /tmp/nhk-vite.log 2>&1 &
          timeout 180s node scripts/nhk-calm-browser.mjs 2>&1 | tee /tmp/nhk-artifacts/browser-log.txt
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/nhk-artifacts/browser-results.json'))
          assert r['status']=='PASS' and len(r['results'])>=15 and not r['errors'],r
          assert not [v for a in r['audits'] for v in a['violations'] if v['impact'] in ('serious','critical')]
          PY
      - name: Commit reviewed corrections to feature branch only
        run: |
          test "$GITHUB_REF" = refs/heads/nihongo-calm-ui-20260905
          git add -- src/nhkCalm.css scripts/nhk-calm-browser.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Fix calm text contrast and close browser harness on failures'
            git push origin HEAD:nihongo-calm-ui-20260905
          fi
          git rev-parse HEAD > /tmp/nhk-artifacts/validated-source-commit.txt
      - name: Preserve source and test evidence for supervisor review
        if: always()
        run: |
          mkdir -p /tmp/nhk-artifacts
          tar -czf /tmp/nhk-artifacts/review-source.tar.gz src scripts public docs api supabase package.json package-lock.json index.html vite.config.ts tsconfig.json tailwind.config.js postcss.config.js vercel.json
          cp /tmp/nhk-vite.log /tmp/nhk-artifacts/vite-log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhk-calm-ui-${{ github.run_number }}
          path: /tmp/nhk-artifacts/
          retention-days: 7
