name: Companion independent preview access check
on:
  push:
    branches: [nihongo-adaptive-companion-v3-20260909]
    paths: [scripts/companion-preview-access.mjs, .github/workflows/companion-preview-access.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/companion-preview-access.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-preview-access
          path: artifacts/companion-access/
