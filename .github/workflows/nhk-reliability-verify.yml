name: NHK Reliability Verification
on:
  push:
    branches: [nihongo-reliability-20260905]
    paths:
      - '.github/workflows/nhk-reliability-verify.yml'
      - 'scripts/reliability-trigger.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nhk-reliability-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/nihongo-reliability-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Match exact reviewed backend source
        run: |
          mkdir -p /tmp/nhk-artifacts
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('supabase/functions/nihongo-sentence/index.ts');s=p.read_text()
          wanted='0faff0a49537bbd15d3a5c53237a83f859c47777e9e6138ae539ae0180501206'
          if hashlib.sha256(s.encode()).hexdigest()!=wanted:
              assert hashlib.sha256(s.encode()).hexdigest()=='5abb9841a24c0e449884ea8536ac6b1c503fa62b569fc5991d592bee045c3766','Unexpected source drift'
              s=s.replace("version:'sentence-v2'", "version:'sentence-v3-terra'").replace("const model = 'gpt-5.6-luna';", "const model = 'gpt-5.6-terra';")
              s=s.replace("    'Grammar and vocabulary must not duplicate each other:", "    'For できなくなる the change is from being able to being unable; for 使わなくなる it is from using to no longer using. Never explain this as an unchanged negative state. In translation, preserve the change/future nuance of なる even under わけではない.',\n    'Grammar and vocabulary must not duplicate each other:")
              s=s.replace('`global:${new Date().toISOString().slice(0,10)}`,p_limit:200','`sentence-global:${new Date().toISOString().slice(0,10)}`,p_limit:40').replace('`client:${client}`,p_limit:20','`sentence-client:${client}`,p_limit:10')
              assert hashlib.sha256(s.encode()).hexdigest()==wanted,'Final source mismatch'
              p.write_text(s)
          assert 'session = sessionForTarget(session, selected);' in Path('src/NhkMorningPage.tsx').read_text()
          PY
          git add -- supabase/functions/nihongo-sentence/index.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Finalize focused teaching model and separate generation budget'
            git push origin HEAD:nihongo-reliability-20260905
          fi
          git rev-parse HEAD > /tmp/nhk-artifacts/source-commit.txt
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, unit tests and build
        id: codecheck
        run: |
          npm run typecheck 2>&1 | tee /tmp/nhk-artifacts/typecheck.txt
          npm test 2>&1 | tee /tmp/nhk-artifacts/tests.txt
          npm run build 2>&1 | tee /tmp/nhk-artifacts/build.txt
      - name: Browser acceptance with isolated synthetic records
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
          npm run dev -- --host 127.0.0.1 > /tmp/nhk-artifacts/vite.txt 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          timeout 150s node scripts/nhk-reliability-browser.mjs 2>&1 | tee /tmp/nhk-artifacts/reliability-browser.txt
          timeout 180s node scripts/nhk-calm-browser.mjs 2>&1 | tee /tmp/nhk-artifacts/calm-browser.txt
      - name: Real focused coach, no browser mocks
        if: ${{ always() && steps.codecheck.outcome == 'success' }}
        run: timeout 150s node scripts/nhk-live-sentence-smoke.mjs
      - name: Preserve reviewed source
        if: always()
        run: |
          mkdir -p /tmp/nhk-artifacts
          git archive HEAD | gzip > /tmp/nhk-artifacts/review-source.tar.gz
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          paths=subprocess.check_output(['git','ls-files','src','api','supabase/functions/nihongo-sentence','public/sw.js'],text=True).splitlines()
          pathlib.Path('/tmp/nhk-artifacts/source-hashes.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhk-reliability-${{ github.run_number }}
          path: /tmp/nhk-artifacts/
          retention-days: 14
