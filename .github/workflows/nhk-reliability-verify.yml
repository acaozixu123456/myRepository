name: NHK Reliability Verification
on:
  push:
    branches: [nihongo-reliability-20260905]
    paths:
      - '.github/workflows/nhk-reliability-verify.yml'
      - 'scripts/reliability-trigger.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nhk-reliability-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/nihongo-reliability-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Final bounded candidate integration
        run: |
          mkdir -p /tmp/nhk-artifacts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/NhkMorningPage.tsx');s=p.read_text()
          if 'session = sessionForTarget(session, selected);' not in s:
              old='  ): NhkMorningSession => {\n    if (!selected.length)';assert s.count(old)==1
              s=s.replace('upsertSentenceAttempt, practiceId}', 'upsertSentenceAttempt, practiceId, sessionForTarget}')
              s=s.replace(old,'  ): NhkMorningSession => {\n    session = sessionForTarget(session, selected);\n    if (!selected.length)')
              s=s.replace("id: draftRef.current.recapText || draftRef.current.completedAt ? practiceId('nhk') : draftRef.current.id,",'id: sessionForTarget(draftRef.current, nextSelected).id,')
              p.write_text(s)
          p=Path('supabase/functions/nihongo-sentence/index.ts');s=p.read_text()
          if 'minItems = 0' not in s:
              s=s.replace("const list = (items: unknown, maxItems: number) => ({type:'array',items,maxItems});", "const list = (items: unknown, maxItems: number, minItems = 0) => ({type:'array',items,minItems,maxItems});").replace('examples:list(example,3)', 'examples:list(example,3,1)')
              s=s.replace("if (!Array.isArray(values)) throw new Error('invalid_points');", "if (!Array.isArray(values)) throw new Error(`invalid_points_${kind}_array`);")
              s=s.replace("      if (!object(v) || !keys.every(k=>str(v[k])) || !Array.isArray(v.examples) || v.examples.length < 1\n        || !v.examples.every((e:unknown)=>object(e)&&str(e.ja)&&str(e.zh))) throw new Error('invalid_points');", "      if (!object(v) || !keys.every(k=>str(v[k]))) throw new Error(`invalid_points_${kind}_fields`);\n      if (!Array.isArray(v.examples) || v.examples.length < 1 || !v.examples.every((e:unknown)=>object(e)&&str(e.ja)&&str(e.zh))) throw new Error(`invalid_points_${kind}_examples`);")
              s=s.replace("  try {\n    const model", "  let stage = 'request';\n  try {\n    const model")
              s=s.replace('    const payload = await response.json();', "    stage = 'response';\n    const payload = await response.json();")
              s=s.replace('    const recommendation = check(JSON.parse(output),input); const generatedAt = Date.now();', "    stage = 'parse';\n    const parsed = JSON.parse(output);\n    stage = 'validate';\n    const recommendation = check(parsed,input); const generatedAt = Date.now();\n    stage = 'cache';")
              s=s.replace("  } catch {return json({ok:false,reason:'sentence_analysis_failed'},502);}", """  } catch (error) {
              const known = /^(invalid_analysis|source_alignment_failed|invalid_points_(grammar|vocabulary)_(array|fields|examples)|incomplete_analysis)$/;
              const detail = error instanceof Error && known.test(error.message) ? error.message : error instanceof Error && error.name === 'TimeoutError' ? 'timeout' : 'unexpected_response';
              console.error('sentence_analysis_error',JSON.stringify({stage,detail}));
              return json({ok:false,reason:'sentence_analysis_failed',stage,detail},502);
            }""")
              p.write_text(s)
          assert 'session = sessionForTarget(session, selected);' in Path('src/NhkMorningPage.tsx').read_text()
          assert 'minItems = 0' in s and 'gpt-5.6-luna' in s and "stage = 'validate'" in s
          PY
          git add -- src/NhkMorningPage.tsx supabase/functions/nihongo-sentence/index.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Preserve answer target identity and align focused response contract'
            git push origin HEAD:nihongo-reliability-20260905
          fi
          git rev-parse HEAD > /tmp/nhk-artifacts/source-commit.txt
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, unit tests and build
        id: codecheck
        run: |
          npm run typecheck 2>&1 | tee /tmp/nhk-artifacts/typecheck.txt
          npm test 2>&1 | tee /tmp/nhk-artifacts/tests.txt
          npm run build 2>&1 | tee /tmp/nhk-artifacts/build.txt
      - name: Browser acceptance with isolated synthetic records
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
          npm run dev -- --host 127.0.0.1 > /tmp/nhk-artifacts/vite.txt 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          timeout 150s node scripts/nhk-reliability-browser.mjs 2>&1 | tee /tmp/nhk-artifacts/reliability-browser.txt
          timeout 180s node scripts/nhk-calm-browser.mjs 2>&1 | tee /tmp/nhk-artifacts/calm-browser.txt
      - name: Real focused coach, no browser mocks
        if: ${{ always() && steps.codecheck.outcome == 'success' }}
        run: timeout 150s node scripts/nhk-live-sentence-smoke.mjs
      - name: Preserve reviewed source
        if: always()
        run: |
          mkdir -p /tmp/nhk-artifacts
          git archive HEAD | gzip > /tmp/nhk-artifacts/review-source.tar.gz
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          paths=subprocess.check_output(['git','ls-files','src','api','supabase/functions/nihongo-sentence','public/sw.js'],text=True).splitlines()
          pathlib.Path('/tmp/nhk-artifacts/source-hashes.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhk-reliability-${{ github.run_number }}
          path: /tmp/nhk-artifacts/
          retention-days: 14
