name: NHK Reliability Verification
on:
  push:
    branches: [nihongo-reliability-20260905]
    paths:
      - '.github/workflows/nhk-reliability-verify.yml'
      - 'scripts/reliability-trigger.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nhk-reliability-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/nihongo-reliability-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Source-alignment hardening and candidate snapshot
        run: |
          mkdir -p /tmp/nhk-artifacts
          python3 - <<'PY'
          import pathlib
          assert pathlib.Path('src/nhkBackup.ts').exists(),'Candidate source is required; never replay transport data'
          path=pathlib.Path('src/nhkCoach.ts');text=path.read_text()
          old='''      && item.sentenceIndex < candidates.length
                ? item.sentenceIndex
                : candidates.findIndex(candidate => sentenceKey(candidate) === sentenceKey(item.sentence));'''
          new='''      && item.sentenceIndex < candidates.length
                && sentenceKey(candidates[item.sentenceIndex]) === sentenceKey(item.sentence)
                ? item.sentenceIndex
                : candidates.findIndex((candidate, index) => !used.has(index) && sentenceKey(candidate) === sentenceKey(item.sentence));'''
          if old in text:
              assert text.count(old)==1;path.write_text(text.replace(old,new))
          else: assert '&& sentenceKey(candidates[item.sentenceIndex]) === sentenceKey(item.sentence)' in text
          path=pathlib.Path('src/nhkReliability.test.ts');text=path.read_text()
          if 'numeric indices cannot attach explanations to different source text' not in text:
              text=text.replace("import {buildRecommendationForSentence} from './nhkCoach';", "import {buildRecommendationForSentence,normalizeNhkCoachResult} from './nhkCoach';")
              text+='''\nit('numeric indices cannot attach explanations to different source text',()=>{
            const source=[sentence,'別の文です。',sentence];
            const point={...buildRecommendationForSentence(sentence,1),translationZh:'SOURCE_BOUND_TRANSLATION'};
            const input={summaryJa:'test',summaryZh:'test',opinionQuestion:'test',recommendations:[point]};
            const result=normalizeNhkCoachResult(input,'test',source);
            const bound=result.recommendations.find(r=>r.translationZh==='SOURCE_BOUND_TRANSLATION');
            expect(bound?.sentence).toBe(sentence);expect(bound?.sentenceIndex).toBe(0);
          });\n'''
              path.write_text(text)
          allowed='api/nhk-sentence.ts public/sw.js scripts/nhk-reliability-browser.mjs scripts/nhk-live-sentence-smoke.mjs src/NhkBackupPanel.tsx src/NhkGentleUI.tsx src/NhkMorningPage.tsx src/NhkSentenceTools.tsx src/main.tsx src/nhkBackup.ts src/nhkCalm.css src/nhkCoach.ts src/nhkGentle.ts src/nhkLibrary.ts src/nhkMorning.ts src/nhkPracticeHistory.ts src/nhkReliability.test.ts src/nhkSentenceAnalysis.ts supabase/functions/nihongo-sentence/index.ts'.split()
          assert all(pathlib.Path(p).exists() for p in allowed)
          pathlib.Path('/tmp/nhk-allowed').write_text('\n'.join(allowed))
          PY
          test "$GITHUB_REF" = refs/heads/nihongo-reliability-20260905
          mapfile -t paths < /tmp/nhk-allowed
          git add -- "${paths[@]}"
          git rm --ignore-unmatch -- scripts/reliability-transfer.part0 scripts/reliability-transfer.part1
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Bind explanations by source text and remove completed transfer files'
            git push origin HEAD:nihongo-reliability-20260905
          fi
          git rev-parse HEAD > /tmp/nhk-artifacts/source-commit.txt
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, unit tests and production build
        id: codecheck
        run: |
          npm run typecheck 2>&1 | tee /tmp/nhk-artifacts/typecheck.txt
          npm test 2>&1 | tee /tmp/nhk-artifacts/tests.txt
          npm run build 2>&1 | tee /tmp/nhk-artifacts/build.txt
      - name: Browser acceptance with synthetic records
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
          npm run dev -- --host 127.0.0.1 > /tmp/nhk-artifacts/vite.txt 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          timeout 150s node scripts/nhk-reliability-browser.mjs 2>&1 | tee /tmp/nhk-artifacts/reliability-browser.txt
          timeout 180s node scripts/nhk-calm-browser.mjs 2>&1 | tee /tmp/nhk-artifacts/calm-browser.txt
      - name: Real focused coach smoke independently of browser mocks
        if: ${{ always() && steps.codecheck.outcome == 'success' }}
        run: timeout 150s node scripts/nhk-live-sentence-smoke.mjs
      - name: Preserve evidence and source hashes
        if: always()
        run: |
          mkdir -p /tmp/nhk-artifacts
          python3 - <<'PY'
          import pathlib,hashlib,json,tarfile
          paths=pathlib.Path('/tmp/nhk-allowed').read_text().splitlines() if pathlib.Path('/tmp/nhk-allowed').exists() else []
          hashes={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths if pathlib.Path(p).exists()}
          pathlib.Path('/tmp/nhk-artifacts/source-hashes.json').write_text(json.dumps(hashes,indent=2))
          with tarfile.open('/tmp/nhk-artifacts/review-source.tar.gz','w:gz') as tar:
              for p in hashes: tar.add(p,arcname=p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhk-reliability-${{ github.run_number }}
          path: /tmp/nhk-artifacts/
          retention-days: 14
