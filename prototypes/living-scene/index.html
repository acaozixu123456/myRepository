<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101b22" />
    <meta
      name="description"
      content="雨后的日式小街。移一移目光，停留在一盏灯下。"
    />
    <title>雨あがりの路地 · 日本散步日记</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="app" aria-label="雨后日式街景">
      <img
        class="still"
        src="/scene/hero.webp"
        alt="雨后暮色中的日式木屋街道，枫枝映着暖灯，湿润石路延伸至远处薄雾。"
      /><canvas id="scene" aria-label="轻微视差动态街景"></canvas>
      <div class="shade" aria-hidden="true"></div>
      <header>
        <div class="brand">
          <span class="seal" aria-hidden="true">日</span>日本散歩日記
        </div>
        <span class="edition">LIVING SCENE <i></i> 01</span>
      </header>
      <section class="chapter">
        <p class="eyebrow">AFTER THE RAIN</p>
        <h1 lang="ja">雨あがりの路地</h1>
        <p class="intro">雨停了。沿着灯光，停留一会儿。</p>
      </section>
      <button id="cat-hotspot" aria-label="走近店旁的猫拿铁" hidden><span class="hotspot-label" lang="ja">そこにいたの。</span></button>
      <section id="cat-panel" aria-label="陪猫待一会儿" hidden>
        <p class="cat-caption" lang="ja">軒下の、ラテ</p>
        <p id="cat-line" class="line" lang="ja" tabindex="-1"></p>
        <div id="cat-explanation" hidden><p id="cat-translation"></p><p id="cat-note"></p></div>
        <div class="cat-actions"><button id="cat-pet">轻挠下巴</button><button id="cat-look">看看树枝</button><button id="cat-rest">陪它休息</button></div>
        <div class="story-actions"><button id="cat-explain" aria-expanded="false" aria-controls="cat-explanation">读懂这一句</button><button id="cat-back">回到街景</button></div>
      </section>
      <div id="hotspots" aria-label="街景里的五处停留"></div>
      <section id="subtitle" aria-label="场景对话" hidden>
        <p id="speaker"></p>
        <p id="story-line" class="line" lang="ja" tabindex="-1"></p>
        <div id="explanation" hidden>
          <p id="translation" class="translation"></p>
          <p id="word-note"></p>
        </div>
        <div id="choices" aria-label="想说的话"></div>
        <div class="story-actions">
          <button id="explain" aria-expanded="false" aria-controls="explanation">读懂这一句</button>
          <button id="next">继续 <span aria-hidden="true">→</span></button>
          <button id="back">回到街景</button>
        </div>
      </section>
      <nav id="places-nav" aria-label="找一处停留" hidden></nav>
      <footer>
        <span class="location"
          ><span class="dot"></span>夕暮れ <i>／</i> 雨のあと</span
        >
        <p id="hint">沿着灯光，找一处停留</p>
        <div class="controls">
          <button id="places-toggle" aria-label="选择一处停留" aria-expanded="false" aria-controls="places-nav">散步</button>
          <button id="sound" aria-label="开启声音" aria-pressed="false" title="开启声音">♪</button>
          <button id="pause" aria-label="暂停动态" title="暂停动态">Ⅱ</button
          ><button id="fullscreen" aria-label="全屏欣赏" title="全屏欣赏">
            ⛶
          </button>
        </div>
      </footer>
      <p id="notice" role="status"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
