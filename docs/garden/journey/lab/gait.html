<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#cfd8c0;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { buildHorseB, makeSkeleton } from '../src/horse/horseB.js';
import { HorseRigB } from '../src/horse/rigB.js';
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1600, H = +P.get('h') || 900;
const speed = +(P.get('v') || 2.2), cols = +(P.get('cols') || 4), rows = +(P.get('rows') || 2);
const view = P.get('view') || 'side';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#dfe6d2');
scene.add(new THREE.HemisphereLight('#cfe0ff', '#7a6a50', 1.3));
const sun = new THREE.DirectionalLight('#ffe2b8', 2.6); sun.position.set(3, 5, 2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); scene.add(sun);
// 地面画格子，看蹄子是否打滑
const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g2 = cv.getContext('2d'); g2.fillStyle = '#a9b884'; g2.fillRect(0, 0, 256, 256); g2.fillStyle = '#93a372'; g2.fillRect(0, 0, 128, 128); g2.fillRect(128, 128, 128, 128);
const tx = new THREE.CanvasTexture(cv); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(20, 20); tx.colorSpace = THREE.SRGBColorSpace;
const g = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: tx })); g.receiveShadow = true; scene.add(g);
const geo = buildHorseB();
const sk = makeSkeleton();
const mesh = new THREE.SkinnedMesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.78 })); mesh.castShadow = true;
mesh.add(sk.bones.body); mesh.bind(new THREE.Skeleton(sk.list)); mesh.frustumCulled = false;
const root = new THREE.Group(); root.add(mesh); scene.add(root);
const rig = new HorseRigB(mesh, sk.bones, sk.rest);
const steps = [];
rig.onStep = (id, p) => steps.push(id);
// 先走一会儿进入稳定步态
const dt = 1 / 60; let z = 0;
for (let i = 0; i < 180; i++) { rig.update(dt, { speed }); z += speed * dt; root.position.z = z; }
const cam = new THREE.PerspectiveCamera(28, 1, 0.05, 80);
const n = cols * rows; const VW = W / cols, VH = H / rows; cam.aspect = VW / VH; cam.updateProjectionMatrix();
r.setScissorTest(true);
const T = +(P.get('T') || 1.0);
for (let i = 0; i < n; i++) {
  const sub = Math.round(T / n / dt);
  for (let k = 0; k < sub; k++) { rig.update(dt, { speed }); z += speed * dt; root.position.z = z; }
  if (view === 'side') { cam.position.set(5.2, 1.0, z + 0.1); cam.lookAt(0, 0.85, z + 0.1); }
  else if (view === 'back') { cam.position.set(1.4, 2.6, z - 6.5); cam.lookAt(0, 1.0, z + 0.5); }
  else { cam.position.set(3.2, 1.6, z + 3.6); cam.lookAt(0, 0.9, z); }
  const x = (i % cols) * VW, y = H - (Math.floor(i / cols) + 1) * VH;
  r.setViewport(x, y, VW, VH); r.setScissor(x, y, VW, VH); r.render(scene, cam);
}
window.__info = { steps: steps.slice(-12).join(','), phase: rig.phase.toFixed(2) };
window.__ready = true;
</script></body></html>
