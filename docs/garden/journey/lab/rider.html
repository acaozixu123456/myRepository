<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#cfd8c0;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { makeRider } from '../src/actors/actors.js';
const P = new URLSearchParams(location.search);
const W = 1200, H = 800;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#dfe6d2');
scene.add(new THREE.HemisphereLight('#cfe0ff', '#7a6a50', 2.0));
const sun = new THREE.DirectionalLight('#ffe2b8', 2.0); sun.position.set(-3, 4, 3); scene.add(sun);
const grid = new THREE.GridHelper(4, 16); scene.add(grid);
const R = await makeRider('../../public/journey/res/rider.glb');
scene.add(R.root);
const box = new THREE.Box3().setFromObject(R.root);
const kind = P.get('pose') || 'ride';
const ux = +(P.get('ux') || 0), uy = +(P.get('uy') || 0), uz = +(P.get('uz') || 0);
R.pose(kind, 0);
if (P.has('ux')) { const b = R.bones['upperleg.l'], b2 = R.bones['upperleg.r']; }
R.root.updateMatrixWorld(true);
const box2 = new THREE.Box3().setFromObject(R.root);
const hips = new THREE.Vector3(); R.bones.hips.getWorldPosition(hips);
const fl = new THREE.Vector3(); R.bones['foot.l'].getWorldPosition(fl);
const kl = new THREE.Vector3(); R.bones['lowerleg.l'].getWorldPosition(kl);
window.__info = { box: [box.min.toArray(), box.max.toArray()], box2: [box2.min.toArray(), box2.max.toArray()], hips: hips.toArray(), knee: kl.toArray(), foot: fl.toArray(), hipsY: R.hipsY };
const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
const views = [[[2.2, 0.5, 0.0], 'side'], [[0, 0.5, 2.2], 'front'], [[1.6, 0.9, 1.6], '3/4']];
r.setScissorTest(true);
const VW = W / 3; cam.aspect = VW / H; cam.updateProjectionMatrix();
views.forEach(([p], i) => { cam.position.set(...p); cam.lookAt(0, 0.35, 0); r.setViewport(i * VW, 0, VW, H); r.setScissor(i * VW, 0, VW, H); r.render(scene, cam); });
window.__ready = true;
</script></body></html>
