<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猫国志设定集</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=ZCOOL+KuaiLe&display=swap">
<style>/* 布局概念：绘本翻页式长卷。每个阵营一条色带贯穿，猫猫立绘是唯一的“重彩”，其余保持安静。 */
:root {
  --bg: #e9ede2;
  --bg2: #dfe5d6;
  --card: #fbfaf4;
  --card2: #f1efe4;
  --ink: #2b2833;
  --ink2: #5e5a6a;
  --line: #cfd3c3;
  --accent: #d9703a;
  --accent-ink: #ffffff;
  --shadow: 0 2px 0 rgba(43, 40, 51, 0.12), 0 14px 28px -16px rgba(43, 40, 51, 0.35);
  --wei: #3f63ad;
  --shu: #4f9e5e;
  --wu: #d6483c;
  --qun: #7d5aa8;
  --man: #d98a24;
  --xian: #2a9d98;
  --r-sr: #8aa4c8;
  --r-ssr: #a56ad8;
  --r-ur: #e8b73c;
  --font-display: 'ZCOOL KuaiLe', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #171c2a;
    --bg2: #1d2335;
    --card: #232b40;
    --card2: #2b3550;
    --ink: #f1ecdd;
    --ink2: #aeb3c6;
    --line: #36405c;
    --accent: #f08a4b;
    --accent-ink: #20150c;
    --shadow: 0 2px 0 rgba(0, 0, 0, 0.35), 0 16px 30px -16px rgba(0, 0, 0, 0.7);
    --wei: #6f93e0;
    --shu: #6cc07c;
    --wu: #f0685b;
    --qun: #a481d6;
    --man: #f0aa44;
    --xian: #4cc4bd;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #171c2a;
  --bg2: #1d2335;
  --card: #232b40;
  --card2: #2b3550;
  --ink: #f1ecdd;
  --ink2: #aeb3c6;
  --line: #36405c;
  --accent: #f08a4b;
  --accent-ink: #20150c;
  --shadow: 0 2px 0 rgba(0, 0, 0, 0.35), 0 16px 30px -16px rgba(0, 0, 0, 0.7);
  --wei: #6f93e0;
  --shu: #6cc07c;
  --wu: #f0685b;
  --qun: #a481d6;
  --man: #f0aa44;
  --xian: #4cc4bd;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.65;
  font-size: 15px;
  padding-inline: 16px;
  padding-block: 0 56px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1120px; margin-inline: auto; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- 顶部 ---------- */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 14px; flex-wrap: wrap;
}
.top nav { display: flex; gap: 4px; flex-wrap: wrap; }
.top nav a {
  color: var(--ink2); text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: 14px;
}
.top nav a:hover { background: var(--card2); color: var(--ink); }
.brand { font-family: var(--font-display); font-size: 20px; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }

/* ---------- 英雄区 ---------- */
.hero { display: grid; gap: 28px; padding-block: 20px 8px; }
.hero h1 { font-size: clamp(44px, 9vw, 92px); line-height: 1.05; }
.hero h1 span { color: var(--accent); }
.hero .lede { font-size: clamp(16px, 2.2vw, 20px); color: var(--ink2); max-width: 34em; margin-top: 14px; }
.hero .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 14px; border-radius: 999px;
  background: var(--card); box-shadow: var(--shadow); font-size: 14px;
}
.chip b { font-family: var(--font-display); font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--accent); }
.lineup {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin-top: 8px; align-items: end;
  position: relative;
}
.lineup button {
  background: none; border: 0; padding: 0; cursor: pointer; position: relative; transition: transform 0.2s;
}
.lineup button:hover { transform: translateY(-8px) rotate(-1.5deg); }
.lineup img { width: 100%; display: block; }
.lineup::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 6px; height: 14px; border-radius: 50%;
  background: var(--line); z-index: -1; opacity: 0.8;
}
@media (max-width: 720px) { .lineup { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 10px; } .lineup::after { display: none; } }

/* ---------- 章节 ---------- */
section { padding-block: 56px 8px; scroll-margin-top: 12px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 22px; }
.sec-head h2 { font-size: clamp(28px, 4.5vw, 44px); line-height: 1.15; }
.sec-head p { color: var(--ink2); max-width: 38em; }
.eyebrow { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink2); margin-bottom: 6px; }

/* ---------- 世界观 ---------- */
.world { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
@media (max-width: 820px) { .world { grid-template-columns: 1fr; } }
.panel { background: var(--card); border-radius: 22px; padding: 22px 24px; box-shadow: var(--shadow); min-width: 0; }
.panel h3 { font-size: 22px; margin-bottom: 10px; }
.panel p + p { margin-top: 10px; }
.panel .muted { color: var(--ink2); }
.timeline { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.timeline li { display: grid; grid-template-columns: 76px 1fr; gap: 12px; }
.timeline .when { font-family: var(--font-display); color: var(--accent); font-size: 18px; }
.cur { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 4px; }
.cur div { background: var(--card2); border-radius: 14px; padding: 10px 14px; }
.cur b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.cur span { color: var(--ink2); font-size: 13px; }

/* ---------- 阵营 ---------- */
.fac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.fac {
  --c: var(--wei); background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
  overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0;
}
.fac .band { background: var(--c); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; position: relative; }
.fac .glyph {
  width: 58px; height: 58px; border-radius: 16px; background: rgba(255, 255, 255, 0.2); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 34px; border: 3px solid rgba(255, 255, 255, 0.55); flex: none;
}
.fac .band h3 { font-size: 24px; }
.fac .band small { opacity: 0.9; display: block; font-size: 13px; }
.fac .body { padding: 16px 20px 18px; display: grid; gap: 10px; align-content: start; }
.fac .motto { font-family: var(--font-display); font-size: 18px; color: var(--c); }
.fac .kv { display: grid; grid-template-columns: 4.5em 1fr; gap: 4px 10px; font-size: 14px; }
.fac .kv dt { color: var(--ink2); }
.fac .kv dd { margin: 0; }
.fac .mech { background: var(--card2); border-radius: 14px; padding: 10px 14px; font-size: 14px; }
.fac .mech b { color: var(--c); font-family: var(--font-display); font-weight: 400; font-size: 17px; margin-right: 6px; }
.fac .faces { display: flex; gap: 0; margin-top: 4px; }
.fac .faces .face { background: none; border: 0; padding: 0; cursor: pointer; width: 25%; margin-right: -4px; }
.fac .faces .face img { width: 100%; display: block; }
.ring-wrap { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 24px; align-items: center; margin-top: 26px; }
@media (max-width: 820px) { .ring-wrap { grid-template-columns: 1fr; } }
.ring-wrap svg { width: 100%; height: auto; display: block; }
.ring-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.ring-list li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: var(--c); flex: none; transform: translateY(1px); }
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 13px; background: var(--c); color: #fff; }

/* ---------- 图鉴 ---------- */
.filters { display: grid; gap: 10px; margin-bottom: 20px; }
.frow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.frow .lab { font-size: 13px; color: var(--ink2); width: 3.2em; flex: none; }
.fbtn {
  border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px; min-height: 34px;
}
.fbtn[aria-pressed='true'] { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: #fff; }
.fbtn[aria-pressed='true'].plain { color: var(--accent-ink); }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.hcard {
  --c: var(--wei); --rc: var(--r-ssr);
  position: relative; border: 0; padding: 0; text-align: left; cursor: pointer; background: var(--card);
  border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); transition: transform 0.2s;
  display: grid; grid-template-rows: auto auto; min-width: 0;
  outline: 3px solid transparent;
}
.hcard::before {
  content: ''; position: absolute; inset: 0; border-radius: 20px; pointer-events: none; z-index: 2;
  box-shadow: inset 0 0 0 3px var(--rc);
}
.hcard:hover { transform: translateY(-4px); }
.hcard .art {
  background: radial-gradient(circle at 50% 62%, color-mix(in srgb, var(--c) 34%, var(--card)) 0%, var(--card2) 72%);
  padding: 10px 10px 0; position: relative; aspect-ratio: 1 / 1.08;
}
.hcard .art img { width: 100%; height: 100%; object-fit: contain; display: block; }
.hcard .rar {
  position: absolute; left: 10px; top: 10px; z-index: 3; font-family: var(--font-display); font-size: 15px; padding: 1px 10px;
  border-radius: 999px; background: var(--rc); color: #2b2833;
}
.hcard .fg {
  position: absolute; right: 10px; top: 10px; z-index: 3; width: 30px; height: 30px; border-radius: 10px; background: var(--c); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-size: 17px;
}
.hcard .info { padding: 8px 14px 14px; display: grid; gap: 2px; background: var(--card); }
.hcard .info b { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.hcard .info span { font-size: 13px; color: var(--ink2); }
.hcard[data-r='UR'] { --rc: var(--r-ur); }
.hcard[data-r='SSR'] { --rc: var(--r-ssr); }
.hcard[data-r='SR'] { --rc: var(--r-sr); }
.hcard[data-r='UR']::after {
  content: ''; position: absolute; inset: 0; border-radius: 20px; pointer-events: none; z-index: 1;
  background: linear-gradient(115deg, transparent 40%, rgba(255, 244, 190, 0.45) 50%, transparent 60%);
  background-size: 250% 100%; background-position: 120% 0; animation: shine 5s ease-in-out infinite;
}
@keyframes shine { 0%, 60% { background-position: 120% 0; } 100% { background-position: -40% 0; } }
@media (prefers-reduced-motion: reduce) { .hcard[data-r='UR']::after { animation: none; } .hcard, .lineup button { transition: none; } }
.empty { padding: 30px; text-align: center; color: var(--ink2); }

/* ---------- 弹窗 ---------- */
.modal {
  position: fixed; inset: 0; z-index: 50; background: rgba(15, 18, 30, 0.62); display: grid; place-items: center;
  padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.modal-box {
  --c: var(--wei);
  background: var(--card); border-radius: 26px; max-width: 980px; width: 100%; max-height: 100%; overflow: auto;
  display: grid; grid-template-columns: minmax(260px, 0.9fr) 1.3fr; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.6); position: relative;
}
@media (max-width: 760px) { .modal-box { grid-template-columns: 1fr; } }
.modal .stage {
  background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--c) 40%, var(--card)) 0%, var(--card2) 75%);
  padding: 20px; display: grid; align-content: center; justify-items: center; gap: 8px; position: relative;
}
.modal .stage img { width: min(100%, 360px); }
.modal .meta { padding: 24px 26px 26px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.modal h3 { font-size: 34px; line-height: 1.1; }
.modal .sub { color: var(--ink2); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { padding: 2px 12px; border-radius: 999px; font-size: 13px; background: var(--card2); }
.tag.f { background: var(--c); color: #fff; }
.tag.r { background: var(--rc, var(--r-ssr)); color: #2b2833; font-family: var(--font-display); }
.quote { border-left: 4px solid var(--c); padding: 2px 0 2px 12px; font-family: var(--font-display); font-size: 18px; }
.stats { display: grid; gap: 6px; }
.stat { display: grid; grid-template-columns: 2.2em 1fr 3.4em; gap: 8px; align-items: center; font-size: 13px; }
.stat i { height: 10px; border-radius: 999px; background: var(--card2); display: block; overflow: hidden; }
.stat i s { display: block; height: 100%; background: var(--c); border-radius: 999px; }
.stat em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.skills { display: grid; gap: 8px; }
.skill { background: var(--card2); border-radius: 14px; padding: 10px 14px; display: grid; gap: 4px; }
.skill .h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.skill .k { font-size: 12px; padding: 0 9px; border-radius: 999px; background: var(--ink); color: var(--bg); }
.skill .k.ultimate { background: var(--accent); color: var(--accent-ink); }
.skill .k.awaken { background: var(--r-ur); color: #2b2833; }
.skill .k.passive { background: var(--c); color: #fff; }
.skill b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.skill .tg { font-size: 12px; color: var(--ink2); margin-left: auto; }
.skill p { font-size: 14px; }
.skill .sts { display: flex; gap: 4px; flex-wrap: wrap; }
.skill .sts span { font-size: 12px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); }
.close {
  position: absolute; right: 12px; top: 12px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--ink); color: var(--bg); font-size: 20px; line-height: 1;
}
.navb { display: flex; gap: 8px; }
.navb button { flex: 1; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px; cursor: pointer; }

/* ---------- 状态与羁绊 ---------- */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.stl { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.st { background: var(--card); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 38px 1fr; gap: 4px 12px; }
.st .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: color-mix(in srgb, var(--good, #4f9e5e) 22%, var(--card2)); grid-row: span 2; }
.st.debuff .ic { background: color-mix(in srgb, var(--wu) 22%, var(--card2)); }
.st b { font-family: var(--font-display); font-weight: 400; font-size: 17px; display: flex; gap: 8px; align-items: center; }
.st b small { font-family: var(--font-body); font-size: 11px; padding: 0 8px; border-radius: 999px; background: var(--card2); color: var(--ink2); }
.st p { font-size: 13px; color: var(--ink2); }
.bond { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 6px; }
.bond .faces { display: flex; }
.bond .faces img { width: 56px; margin-right: -10px; }
.bond b { font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.bond p { font-size: 14px; color: var(--ink2); }
.bonds { display: grid; gap: 12px; }

/* ---------- UI 风格板 ---------- */
.ui-board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .ui-board { grid-template-columns: 1fr; } }
.swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.sw { border-radius: 14px; overflow: hidden; background: var(--card2); font-size: 12px; }
.sw i { display: block; height: 54px; }
.sw span { display: block; padding: 6px 10px; line-height: 1.3; }
.sw b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 15px; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.gbtn {
  font-family: var(--font-display); font-size: 20px; border: 0; cursor: pointer; padding: 10px 26px 12px; border-radius: 18px;
  background: linear-gradient(#ffb25c, #f08a2b); color: #5a2a05; box-shadow: 0 5px 0 #b95f12, 0 10px 14px -6px rgba(185, 95, 18, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.55);
  position: relative; top: 0; transition: top 0.08s, box-shadow 0.08s;
}
.gbtn:active { top: 4px; box-shadow: 0 1px 0 #b95f12, inset 0 2px 0 rgba(255, 255, 255, 0.55); }
.gbtn.green { background: linear-gradient(#9ee08a, #55b24b); color: #14400f; box-shadow: 0 5px 0 #2f7d29, 0 10px 14px -6px rgba(47, 125, 41, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.55); }
.gbtn.blue { background: linear-gradient(#8fd0ff, #4a95e0); color: #0f2f57; box-shadow: 0 5px 0 #2563a8, 0 10px 14px -6px rgba(37, 99, 168, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.55); }
.gbtn.ghost { background: var(--card2); color: var(--ink); box-shadow: 0 4px 0 var(--line); }
.mini-rules { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.mini-rules li { display: grid; grid-template-columns: 6.5em 1fr; gap: 10px; }
.mini-rules b { font-family: var(--font-display); font-weight: 400; color: var(--accent); }
.phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 28px; justify-items: center; margin-top: 24px; }
.phone {
  width: 100%; max-width: 330px; aspect-ratio: 9 / 18.2; border-radius: 38px; background: #1c1b22; padding: 9px; box-shadow: var(--shadow); position: relative;
}
.screen { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; position: relative; display: grid; font-size: 12px; color: #2b2833; background: #cfe6c9; }
.ph-cap { text-align: center; margin-top: 10px; color: var(--ink2); font-size: 13px; }
.phone-col { width: 100%; max-width: 330px; }
/* 主界面 */
.scr-idle { grid-template-rows: auto 1fr auto auto; background: linear-gradient(#bfe3f3 0%, #e9f4dd 24%, #9bcf86 24%, #7fbd6c 100%); }
.hud { display: flex; justify-content: space-between; gap: 6px; padding: 10px 10px 4px; z-index: 2; }
.pf { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.85); border-radius: 999px; padding: 3px 10px 3px 4px; font-weight: 700; }
.pf .av { width: 26px; height: 26px; border-radius: 50%; background: #f6d9c0; overflow: hidden; }
.pf .av img { width: 150%; margin: -12% 0 0 -22%; }
.res { display: flex; gap: 4px; }
.res span { background: rgba(255, 255, 255, 0.85); border-radius: 999px; padding: 3px 10px; font-weight: 700; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.res i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.field { position: relative; display: block; }
.field .cat { position: absolute; width: 29%; }
.field .cat img { width: 100%; display: block; }
.field .vs { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); font-family: var(--font-display); font-size: 22px; color: #fff; text-shadow: 0 2px 0 #b95f12, 0 0 8px rgba(0,0,0,.25); }
.field .wave { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(43, 40, 51, 0.78); color: #fff; border-radius: 999px; padding: 2px 14px; font-weight: 700; white-space: nowrap; }
.field .dmg { position: absolute; font-family: var(--font-display); color: #fff; font-size: 17px; text-shadow: -1px -1px 0 #d6483c, 1px -1px 0 #d6483c, -1px 1px 0 #d6483c, 1px 1px 0 #d6483c; }
.field .skillbar { position: absolute; left: 6px; right: 6px; top: 34px; display: flex; gap: 4px; justify-content: center; }
.field .skillbar i { width: 36px; height: 36px; border-radius: 12px; border: 2px solid #fff; background: var(--c); overflow: hidden; position: relative; display: block; }
.field .skillbar i img { width: 150%; margin: -10% 0 0 -25%; }
.field .skillbar i s { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.55); display: block; }
.idle-box { margin: 0 10px; background: rgba(255, 252, 240, 0.94); border-radius: 18px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
.idle-box .chest { width: 40px; height: 34px; border-radius: 10px; background: linear-gradient(#ffcf6a, #f2a52b); display: grid; place-items: center; font-family: var(--font-display); color: #7a420a; font-size: 18px; flex: none; }
.idle-box b { font-family: var(--font-display); font-weight: 400; font-size: 14px; display: block; }
.idle-box .gbtn { white-space: nowrap; font-size: 14px; padding: 4px 14px 6px; border-radius: 12px; margin-left: auto; box-shadow: 0 3px 0 #b95f12, inset 0 2px 0 rgba(255,255,255,.55); }
.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: #5a3d2b; padding: 6px 6px 10px; gap: 4px; margin-top: 8px; }
.nav span { display: grid; justify-items: center; gap: 2px; color: #e9d6b8; font-size: 11px; border-radius: 12px; padding: 4px 0; }
.nav span.on { background: #7a553b; color: #fff; }
.nav svg { width: 22px; height: 22px; }
/* 招募 */
.scr-gacha { grid-template-rows: auto 1fr auto; background: radial-gradient(circle at 50% 38%, #fff3c9 0%, #ffd78a 28%, #c47ad8 70%, #5b3a86 100%); }
.gacha-art { position: relative; display: grid; place-items: center; }
.gacha-art .ray { position: absolute; width: 130%; aspect-ratio: 1; background: repeating-conic-gradient(rgba(255,255,255,.35) 0 8deg, transparent 8deg 22deg); border-radius: 50%; opacity: .6; mask-image: radial-gradient(circle, #000 20%, transparent 68%); -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 68%); }
.gacha-art img { width: 78%; position: relative; }
.gacha-art .nm { position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%); background: #2b2833; color: #ffe08a; padding: 3px 18px; border-radius: 999px; font-family: var(--font-display); font-size: 18px; white-space: nowrap; }
.gacha-art .up { position: absolute; left: 12px; top: 8px; background: #e8b73c; padding: 2px 12px; border-radius: 999px; font-family: var(--font-display); font-size: 14px; }
.gacha-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 12px 14px; }
.gacha-btns .gbtn { font-size: 15px; padding: 6px 4px 9px; border-radius: 14px; }
.gacha-btns small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 700; opacity: .85; }
.rates { display: flex; justify-content: center; gap: 6px; padding-bottom: 4px; }
.rates span { background: rgba(43,40,51,.7); color: #fff; padding: 1px 10px; border-radius: 999px; font-size: 11px; }

/* ---------- 玩法与路线 ---------- */
.loop { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.loop .step { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); }
.loop .step b { font-family: var(--font-display); font-weight: 400; font-size: 19px; display: block; margin-bottom: 4px; }
.loop .step p { font-size: 14px; color: var(--ink2); }
.road { display: grid; gap: 12px; margin-top: 18px; }
.phase { display: grid; grid-template-columns: 110px 1fr; gap: 14px; background: var(--card); border-radius: 18px; padding: 14px 18px; box-shadow: var(--shadow); }
.phase.now { box-shadow: inset 6px 0 0 var(--accent), var(--shadow); }
.phase .n { font-family: var(--font-display); font-size: 18px; }
.phase .n small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--ink2); }
.phase p { font-size: 14px; }
@media (max-width: 560px) { .phase { grid-template-columns: 1fr; gap: 4px; } }
.ask { background: var(--card); border: 2px dashed var(--accent); border-radius: 22px; padding: 20px 24px; margin-top: 30px; }
.ask ol { margin: 8px 0 0; padding-left: 1.3em; display: grid; gap: 6px; }
footer { margin-top: 60px; color: var(--ink2); font-size: 13px; text-align: center; }
.themebtn { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: 13px; }
</style>
